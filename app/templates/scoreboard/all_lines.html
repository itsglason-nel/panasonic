<!DOCTYPE html>
<html lang="en">
<head>
    <script src="{{ url_for('static', filename='js/tabscope.js') }}" data-base="{{ request.script_root }}"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMPC Scoreboard - All Lines</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --primary: #3b82f6;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            font-weight: 700;
            margin-bottom: 30px;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }
        .scoreboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .line-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .line-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            border-color: var(--primary);
        }
        .line-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--success);
            box-shadow: 0 0 10px var(--success);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .stat-box {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .stat-value {
            font-size: 28px;
            font-weight: 800;
            font-family: monospace;
        }
        .plan-val { color: var(--primary); }
        .act-val { color: var(--success); }
        .diff-val.positive { color: var(--success); }
        .diff-val.negative { color: var(--danger); }
        .current-model {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
        }
        .current-model span {
            font-weight: 700;
            color: var(--warning);
        }
    </style>
</head>
<body>
    <h1>Panasonic Line Scoreboards</h1>
    <div class="scoreboard-grid" id="grid">
        {% for line in lines %}
        <a href="/scoreboard/line/{{ line.lineno }}" class="line-card" id="card-{{ line.lineno }}">
            <div class="line-title">
                {{ line.lineno }} - {{ line.name }}
                <div class="status-dot"></div>
            </div>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">Plan</div>
                    <div class="stat-value plan-val" id="plan-{{ line.lineno }}">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Actual</div>
                    <div class="stat-value act-val" id="act-{{ line.lineno }}">0</div>
                </div>
            </div>
            <div class="current-model">
                Running: <span id="model-{{ line.lineno }}">None</span>
            </div>
        </a>
        {% endfor %}
    </div>

    <script>
        const socket = io();
        
        function updateScoreboard() {
            fetch('/api/scoreboard/data')
                .then(r => r.json())
                .then(data => {
                    if(!data.success) return;
                    
                    // Group data by line
                    const lineData = {};
                    data.data.forEach(sched => {
                        if (!lineData[sched.lineno]) {
                            lineData[sched.lineno] = { plan: 0, act: 0, currentModel: null };
                        }
                        lineData[sched.lineno].plan += sched.plan;
                        lineData[sched.lineno].act += sched.act || 0; // fallback if act not returned
                        // Assume last model in seq is current for simplistic view, or logic for "running"
                        if ((sched.act || 0) < sched.plan) {
                            if (!lineData[sched.lineno].currentModel) {
                                lineData[sched.lineno].currentModel = sched.modelcode;
                            }
                        }
                    });
                    
                    Object.keys(lineData).forEach(lineno => {
                        const p = document.getElementById('plan-' + lineno);
                        const a = document.getElementById('act-' + lineno);
                        const m = document.getElementById('model-' + lineno);
                        if (p) p.innerText = lineData[lineno].plan;
                        if (a) a.innerText = lineData[lineno].act;
                        if (m) m.innerText = lineData[lineno].currentModel || 'Completed';
                    });
                });
        }
        
        socket.on('scoreboard_update', (msg) => {
            console.log('Update received:', msg);
            updateScoreboard();
        });
        
        // Initial load
        updateScoreboard();
        // Poll every 10s as backup
        setInterval(updateScoreboard, 10000);
    </script>
</body>
</html>
