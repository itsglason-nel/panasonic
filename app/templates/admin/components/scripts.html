    window.openQCReportModal = function () {
        document.getElementById('qc-specific-serial').value = '';
        document.getElementById('qc-specific-error').style.display = 'none';

        const select = document.getElementById('qc-specific-model');
        if (select.tomselect) {
            select.tomselect.clearOptions();
            select.tomselect.addOption({ value: "", text: "Loading models..." });
            select.tomselect.refreshOptions(false);
        } else {
            select.innerHTML = '<option value="">Loading models...</option>';
        }

        document.getElementById('modal-specific-qc').classList.add('active');

        // Fetch models to populate dropdown
        fetch('/admin/api/models')
            .then(r => r.json())
            .then(models => {
                if (select.tomselect) {
                    select.tomselect.clearOptions();
                    select.tomselect.addOption({ value: "", text: "-- Select Model --" });
                    models.forEach(m => {
                        const val = m.model_number || m;
                        select.tomselect.addOption({ value: val, text: val });
                    });
                    select.tomselect.refreshOptions(false);
                } else {
                    select.innerHTML = '<option value="">-- Select Model --</option>';
                    models.forEach(m => {
                        const option = document.createElement('option');
                        const val = m.model_number || m;
                        option.value = val;
                        option.textContent = val;
                        select.appendChild(option);
                    });
                }
            })
            .catch(err => {
                console.error("Failed to fetch models:", err);
                if (select.tomselect) {
                    select.tomselect.clearOptions();
                    select.tomselect.addOption({ value: "", text: "Error loading models" });
                    select.tomselect.refreshOptions(false);
                } else {
                    select.innerHTML = '<option value="">Error loading models</option>';
                }
            });

    window.resolveWip = function () {
        if (!currentWipData) return;

        const saveBtn = document.getElementById('wip-save-btn');
        if (saveBtn) saveBtn.disabled = true;

        const action = document.querySelector('input[name="wip_active_action"]:checked')?.value || 'continue';
        const crsNewPlanInput = document.getElementById('wip-crs-new-plan');
        const crsNewPlan = crsNewPlanInput.value;

        if (action === 'continue' && document.getElementById('wip-crs-plan-edit').style.display !== 'none') {
            const minValid = parseInt(crsNewPlanInput.min) || 0;
            if (parseInt(crsNewPlan) < minValid) {
                alert(`Total plan for ${document.getElementById('wip-crs-model').innerText} cannot be less than units already produced (${minValid}).`);
                if (saveBtn) saveBtn.disabled = false;
                return;
            }
        }

        const unstartedPlans = {};
        if (action === 'continue') {
            document.querySelectorAll('.wip-unstarted-checkbox:checked').forEach(cb => {
                const planInput = document.querySelector(`.wip-unstarted-plan[data-id="${cb.value}"]`);
                unstartedPlans[cb.value] = planInput ? planInput.value : null;
            });
        }

        const payload = {
            line_id: currentWipLine,
            action: action,
            crs_new_plan: crsNewPlan,
            unstarted_plans: unstartedPlans
        };

        const doFetch = () => {
            fetch('/admin/api/wip-resolve', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
                .then(r => r.json())
                .then(res => {
                    if (saveBtn) saveBtn.disabled = false;
                    if (res.success) {
                        closeWipModal();
                        showToast("WIP resolved successfully", 'success');
                        const dateDisplay = document.getElementById('sched-date-display');
                        if (dateDisplay) fetchSchedules(dateDisplay.innerText);
                    } else {
                        showToast(res.error || "Error resolving WIP", 'error');
                    }
                })
                .catch(err => {
                    if (saveBtn) saveBtn.disabled = false;
                    showToast("Error resolving WIP", 'error');
                });
        };

        if (action === 'clear') {
            showConfirmModal("Are you sure you want to discard this unfinished schedule and clear it from the conveyor belt? This cannot be undone.", () => {
                doFetch();
            });
            if (saveBtn) saveBtn.disabled = false;
        } else {
            doFetch();
        }
    };

        const tbody = document.getElementById('shifts-tbody');

        fetch('/admin/api/shifts')

                data.forEach((shift, index) => {

                    tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${shift.name}</td>

    function saveShift() {
        const id = document.getElementById('shift-id').value;
        const start_time = document.getElementById('shift-start').value;
        const end_time = document.getElementById('shift-end').value;

        if (!start_time || !end_time || !id) {
            showToast('Please fill out all required fields.', 'error');
            return;
        }

        const url = `/admin/api/shifts/${id}`;
        const method = 'PUT';

        fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ start_time, end_time })
        })
            .then(r => r.json())
            .then(res => {
                if (res.success) {
                    closeShiftModal();
                    fetchShifts();
                    showToast('Shift saved successfully!', 'success');
                    document.getElementById('shift-edit-btn').disabled = true;
                    currentShiftId = null;
                } else {

            .catch(err => {

                showToast('Server error while saving shift.', 'error');
            });
    }

    window.submitCreateTransferSlip = function() {
        const date = document.getElementById('create-ts-date').value;
        const line = document.getElementById('create-ts-line').value;
        const shift = document.getElementById('create-ts-shift').value;
        const modelcode = document.getElementById('create-ts-modelcode').value.trim();
        
        if (!date || !line || !shift || !modelcode) {
            showToast('Please fill all fields', 'error');
            return;
        }
        
        const btn = document.querySelector('#modal-create-ts .btn-primary');
        const oldText = btn.innerHTML;
        btn.innerHTML = 'Generating...';
        btn.disabled = true;
        
        fetch('/admin/api/transfer-slips', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ date, line, shift, modelcode })
        }).then(r => r.json()).then(data => {
            btn.innerHTML = oldText;
            btn.disabled = false;
            
            if (data.success) {
                showToast(`Transfer Slip ${data.ref_number} generated!`, 'success');
                closeModal('modal-create-ts');
                loadTransferSlips(1);
                // Automatically open it
                window.open(`/admin/print-transfer-slip/${data.slip_id}`, '_blank');
            } else {
                showToast(data.error || 'Failed to generate', 'error');
            }
        }).catch(err => {
            btn.innerHTML = oldText;
            btn.disabled = false;
            showToast('Network error', 'error');
        });
    };

    window.loadQCUnitsForPrint = function() {
        const date = document.getElementById('print-qc-date').value;
        const line = document.getElementById('print-qc-line').value;
        const serial = document.getElementById('print-qc-search').value.trim();
        const listEl = document.getElementById('qc-units-list');
        const countEl = document.getElementById('qc-selected-count');
        
        let url = `/admin/api/qc-print-units?dummy=1`;
        if (date) url += `&date=${encodeURIComponent(date)}`;
        if (line && line !== 'all') url += `&line=${encodeURIComponent(line)}`;
        if (serial) url += `&serial=${encodeURIComponent(serial)}`;
        
        listEl.innerHTML = `<div style="padding: 20px; text-align: center; color: #94a3b8; font-size: 14px;">Loading...</div>`;
        document.getElementById('qc-select-all').checked = false;
        countEl.textContent = '0 selected';
        
        fetch(url).then(r => r.json()).then(data => {
            if (!data.success || !data.records.length) {
                listEl.innerHTML = `<div style="padding: 20px; text-align: center; color: #94a3b8; font-size: 14px;">No completed units found for these filters.</div>`;
                return;
            }
            
            listEl.innerHTML = '';
            data.records.forEach(r => {
                const item = document.createElement('div');
                item.style.cssText = 'padding: 10px 15px; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: background 0.2s;';
                item.onmouseover = () => item.style.background = '#f8fafc';
                item.onmouseout = () => item.style.background = 'white';
                
                item.innerHTML = `
                    <input type="checkbox" class="qc-unit-checkbox" value="${r.serial}" style="width: 15px; height: 15px; cursor: pointer;">
                    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
                        <div style="display: flex; justify-content: space-between;">
                            <strong style="font-family: monospace; font-size: 14px;">${r.serial}</strong>
                            <span style="font-size: 12px; color: #64748b;">${r.time}</span>
                        </div>
                        <div style="display: flex; gap: 10px; font-size: 12px; color: #64748b;">
                            <span>Model: <strong>${r.modelcode}</strong></span>
                            <span>Line: <strong>${r.line}</strong></span>
                        </div>
                    </div>
                `;
                
                // Allow clicking anywhere on the row to toggle checkbox
                item.addEventListener('click', (e) => {
                    if (e.target.tagName !== 'INPUT') {
                        const cb = item.querySelector('input');
                        cb.checked = !cb.checked;
                        updateQCSelectedCount();
                    }
                });
                
                item.querySelector('input').addEventListener('change', updateQCSelectedCount);
                listEl.appendChild(item);
            });
        }).catch(err => {
            listEl.innerHTML = `<div style="padding: 20px; text-align: center; color: red; font-size: 14px;">Failed to load.</div>`;
        });
    };

    window.updateQCSelectedCount = function() {

    // ─── SCOREBOARD NATIVE UI LOGIC ──────────────────────────────────────────────────
    let scoreboardRefreshTimer = null;
    let isScoreboardRefreshing = false;

    window.switchScoreboardTab = function(tab) {
        document.getElementById('tab-sb-status').classList.remove('active');
        document.getElementById('tab-sb-sched').classList.remove('active');
        document.getElementById('tab-sb-logs').classList.remove('active');
        document.getElementById('sb-content-status').style.display = 'none';
        document.getElementById('sb-content-sched').style.display = 'none';
        document.getElementById('sb-content-logs').style.display = 'none';

        if (tab === 'status') {
            document.getElementById('tab-sb-status').classList.add('active');
            document.getElementById('sb-content-status').style.display = 'flex';
        } else if (tab === 'sched') {
            document.getElementById('tab-sb-sched').classList.add('active');
            document.getElementById('sb-content-sched').style.display = 'flex';
        } else if (tab === 'logs') {
            document.getElementById('tab-sb-logs').classList.add('active');
            document.getElementById('sb-content-logs').style.display = 'flex';
        }
    };

    function initScoreboardDate() {
        const dateInput = document.getElementById('scoreboard-date-selector');
        if (dateInput && !dateInput.value) {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            dateInput.value = `${yyyy}-${mm}-${dd}`;
        }
    }

    function isScoreboardToday() {
        const dateInput = document.getElementById('scoreboard-date-selector');
        if (!dateInput || !dateInput.value) return false;
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        const todayStr = `${yyyy}-${mm}-${dd}`;
        return dateInput.value === todayStr;
    }

    window.fetchScoreboard = function(isAutoRefresh = false) {
        if (!document.getElementById('panel-scoreboard').classList.contains('active')) return;
        
        // Prevent overlapping refreshes
        if (isAutoRefresh && isScoreboardRefreshing) return;
        isScoreboardRefreshing = true;

        initScoreboardDate();
        
        const dateStr = document.getElementById('scoreboard-date-selector').value;
        const lineStr = document.getElementById('scoreboard-line-selector').value || (globalActiveLines.length > 0 ? globalActiveLines[0].lineno : 'L1');
        const modelStr = document.getElementById('scoreboard-model-selector').value || 'all';
        const sortStr = document.getElementById('scoreboard-sort-selector').value || 'desc';

        // 1. Fetch dynamic models for this line/date (only if not an auto-refresh)
        if (!isAutoRefresh) {
            fetch(`/api/scoreboard/models?line=${encodeURIComponent(lineStr)}&date=${encodeURIComponent(dateStr)}`)
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        const sel = document.getElementById('scoreboard-model-selector');
                        const currentVal = sel.value;
                        sel.innerHTML = '<option value="all">All Models</option>';
                        data.models.forEach(m => {
                            const opt = document.createElement('option');
                            opt.value = m;
                            opt.textContent = m;
                            sel.appendChild(opt);
                        });
                        // Preserve selected if still valid
                        if (data.models.includes(currentVal)) {
                            sel.value = currentVal;
                        }
                    }
                });
        }

        // 2. Fetch Logs
        const logsTbody = document.getElementById('scoreboard-logs-tbody');
        if (!isAutoRefresh) {
            logsTbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Loading...</td></tr>';
        }
        
        fetch(`/api/scoreboard/logs?line=${encodeURIComponent(lineStr)}&date=${encodeURIComponent(dateStr)}&model=${encodeURIComponent(modelStr)}&sort=${encodeURIComponent(sortStr)}&limit=50`)
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    if (data.logs.length === 0) {
                        logsTbody.innerHTML = '<tr><td colspan="5" class="empty-state">No logs found for these filters.</td></tr>';
                    } else {
                        logsTbody.innerHTML = '';
                        data.logs.forEach((log, index) => {
                            const tr = document.createElement('tr');
                            let statusBadge = '';
                            if (log.status === 'GOOD') {
                                statusBadge = '<span class="badge" style="background:#22c55e; color:white; border:none; padding:4px 8px; border-radius:4px; font-size:12px; font-weight:700;">GOOD</span>';
                            } else {
                                statusBadge = '<span class="badge" style="background:#ef4444; color:white; border:none; padding:4px 8px; border-radius:4px; font-size:12px; font-weight:700;">NG</span>';
                            }
                            tr.innerHTML = `
                                <td style="font-weight:600; color:var(--text-muted);">${index + 1}</td>
                                <td style="font-weight:600;">${log.time || '--:--:--'}</td>
                                <td>${log.model}</td>
                                <td style="font-family: monospace; font-weight:600;">${log.serial}</td>
                                <td>${statusBadge}</td>
                            `;
                            logsTbody.appendChild(tr);
                        });
                    }
                }
            })
            .catch(err => console.error(err));

        // 3. Fetch WIP & Schedule Data
        fetch(`/api/scoreboard/data?line=${encodeURIComponent(lineStr)}&date=${encodeURIComponent(dateStr)}`)
            .then(r => r.json())
            .then(data => {
                isScoreboardRefreshing = false;
                if (data.success) {
                    // Update Schedule Grid
                    const schedTbody = document.getElementById('scoreboard-sched-tbody');
                    
                    // On-Going Production Logic
                    const ogContainer = document.getElementById('sb-ongoing-container');
                    if (lineStr === 'all') {
                        ogContainer.style.display = 'none';
                    } else {
                        ogContainer.style.display = 'flex';
                        
                        const shiftStart = new Date(`${data.date}T${data.shift_start}`);
                        const now = new Date(); 
                        let diffSeconds = Math.floor((now - shiftStart) / 1000);
                        if (diffSeconds < 0) diffSeconds = 0;

                        let remainingSeconds = diffSeconds;
                        let activeModel = null;
                        let activeRSched = 0;
                        let activeRAct = 0;
                        let activeVar = 0;
                        
                        data.data.forEach(sched => {
                            let rSched = 0;
                            let requiredSeconds = sched.plan * (sched.takt_time || 1);
                            
                            if (remainingSeconds >= requiredSeconds) {
                                rSched = sched.plan;
                                remainingSeconds -= requiredSeconds;
                            } else {
                                rSched = Math.floor(remainingSeconds / (sched.takt_time || 1));
                                remainingSeconds = 0;
                            }
                            
                            if (rSched > sched.plan) rSched = sched.plan;
                            let variance = sched.actual - rSched;
                            
                            if (sched.status === 'ON-GOING') {
                                activeModel = sched.modelcode;
                                activeRSched = rSched;
                                activeRAct = sched.actual;
                                activeVar = variance;
                            }
                        });
                        
                        if (activeModel) {
                            document.getElementById('sb-og-model').innerText = activeModel;
                            document.getElementById('sb-og-rsched').innerText = activeRSched;
                            document.getElementById('sb-og-ract').innerText = activeRAct;
                            document.getElementById('sb-og-var').innerText = activeVar;
                            
                            let circle = document.getElementById('sb-og-circle');
                            let stext = document.getElementById('sb-og-status');
                            let sicon = document.getElementById('sb-og-icon');
                            
                            if (activeVar < -20) {
                                circle.style.backgroundColor = '#ef4444'; // Red
                                circle.style.borderColor = '#ef4444';
                                circle.style.color = 'white';
                                stext.innerText = 'Behind';
                                sicon.innerText = '!';
                            } else if (activeVar < 0) {
                                circle.style.backgroundColor = '#facc15'; // Yellow
                                circle.style.borderColor = '#facc15';
                                circle.style.color = 'black';
                                stext.innerText = 'Behind';
                                sicon.innerText = '!';
                            } else if (activeVar === 0) {
                                circle.style.backgroundColor = '#84cc16'; // Yellow-Green
                                circle.style.borderColor = '#84cc16';
                                circle.style.color = 'white';
                                stext.innerText = 'On-Time';
                                sicon.innerText = '✓';
                            } else {
                                circle.style.backgroundColor = '#22c55e'; // Green
                                circle.style.borderColor = '#22c55e';
                                circle.style.color = 'white';
                                stext.innerText = 'Ahead';
                                sicon.innerText = '✓';
                            }
                        } else {
                            document.getElementById('sb-og-model').innerText = '—';
                            document.getElementById('sb-og-rsched').innerText = '0';
                            document.getElementById('sb-og-ract').innerText = '0';
                            document.getElementById('sb-og-var').innerText = '0';
                            
                            let circle = document.getElementById('sb-og-circle');
                            circle.style.backgroundColor = 'transparent';
                            circle.style.borderColor = 'var(--border)';
                            circle.style.color = 'var(--text-main)';
                            document.getElementById('sb-og-status').innerText = 'N/A';
                            document.getElementById('sb-og-icon').innerText = '—';
                        }
                    }

                    if (data.data.length === 0) {
                        schedTbody.innerHTML = '<tr><td colspan="4" class="empty-state">No scheduled runs for this date.</td></tr>';
                    } else {
                        schedTbody.innerHTML = '';
                        data.data.forEach(sched => {
                            const tr = document.createElement('tr');
                            let badge = '';
                            if (sched.status === 'DONE') badge = '<span style="color:#22c55e;font-weight:700;">Done</span>';
                            else if (sched.status === 'ON-GOING') badge = '<span style="color:#3b82f6;font-weight:700;">Running</span>';
                            else badge = '<span style="color:#94a3b8;font-weight:700;">Waiting</span>';
                            
                            tr.innerHTML = `
                                <td>${sched.modelcode}</td>
                                <td>${sched.plan}</td>
                                <td>${sched.actual}</td>
                                <td>${badge}</td>
                            `;
                            schedTbody.appendChild(tr);
                        });
                    }

                    // Update WIP Grid
                    if (data.wip) {
                        document.getElementById('sb-wip-att').textContent = data.wip.att || 0;
                        document.getElementById('sb-wip-gms').textContent = data.wip.gms || 0;
                        document.getElementById('sb-wip-spamsi').textContent = data.wip.spamsi || 0;
                        document.getElementById('sb-wip-spamso').textContent = data.wip.spamso || 0;
                        document.getElementById('sb-wip-wc').textContent = data.wip.wc || 0;
                        document.getElementById('sb-wip-ri').textContent = data.wip.ri || 0;
                        document.getElementById('sb-wip-fi').textContent = data.wip.fi || 0;
                        document.getElementById('sb-wip-pack').textContent = data.wip.pack || 0;
                        
                        if (data.wip.models) {
                            document.getElementById('sb-wip-att-model').textContent = data.wip.models.att || '—';
                            document.getElementById('sb-wip-gms-model').textContent = data.wip.models.gms || '—';
                            document.getElementById('sb-wip-spamsi-model').textContent = data.wip.models.spamsi || '—';
                            document.getElementById('sb-wip-spamso-model').textContent = data.wip.models.spamso || '—';
                            document.getElementById('sb-wip-wc-model').textContent = data.wip.models.wc || '—';
                            document.getElementById('sb-wip-ri-model').textContent = data.wip.models.ri || '—';
                            document.getElementById('sb-wip-fi-model').textContent = data.wip.models.fi || '—';
                            document.getElementById('sb-wip-pack-model').textContent = data.wip.models.pack || '—';
                        }
                    }
                }
            })
            .catch(err => {
                isScoreboardRefreshing = false;
                console.error(err);
            });

        manageScoreboardTimer();
    };

    window.loadScoreboardData = function() {
        // Hard refresh (not auto refresh)
        fetchScoreboard(false);
    };

    function manageScoreboardTimer() {
        if (scoreboardRefreshTimer) {
            clearInterval(scoreboardRefreshTimer);
            scoreboardRefreshTimer = null;
        }
        
        // Only auto-refresh if it's today's date and the panel is active
        if (isScoreboardToday() && document.getElementById('panel-scoreboard').classList.contains('active')) {
            scoreboardRefreshTimer = setInterval(() => {
                fetchScoreboard(true);
            }, 10000);
        }
    }

    // Auto-load scoreboard on initial page load if it's the active panel
    document.addEventListener('DOMContentLoaded', () => {
        // Remove old iframe event listeners if any
        const dateInput = document.getElementById('scoreboard-date-selector');
        const lineInput = document.getElementById('scoreboard-line-selector');
        
        if (dateInput) {
            dateInput.addEventListener('change', () => loadScoreboardData());
        }
        if (lineInput) {
            lineInput.addEventListener('change', () => loadScoreboardData());
        }
    });
