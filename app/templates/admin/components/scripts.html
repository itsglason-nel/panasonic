<script>

    // --- GLOBAL SAFEGUARDS ---
    // 1. Intercept fetch to handle session expiration (302 Redirect to Login)
    const originalFetch = window.fetch;
    window.fetch = async function (...args) {
        try {
            const response = await originalFetch(...args);
            const contentType = response.headers.get('content-type');
            if ((response.redirected && response.url.includes('/auth/login')) ||
                (contentType && contentType.includes('text/html'))) {
                window.location.href = (window.tabUrl ? window.tabUrl('/auth/login') : '/auth/login') + '?next=' + encodeURIComponent(window.location.pathname);
                return new Promise(() => { }); // Prevent downstream JSON parsing errors
            }
            if (response.status === 401) {
                window.location.href = (window.tabUrl ? window.tabUrl('/auth/login') : '/auth/login') + '?next=' + encodeURIComponent(window.location.pathname);
                return new Promise(() => { });
            }
            return response;
        } catch (error) {
            throw error;
        }
    };

    // 2. Global fallback to clear all loading spinners if an unexpected JS error occurs
    window.addEventListener('unhandledrejection', function (event) {
        console.error('Unhandled promise rejection caught globally:', event.reason);
        document.querySelectorAll('.spinning').forEach(el => el.classList.remove('spinning'));
        document.querySelectorAll('tbody').forEach(tbody => {
            if (tbody.style.opacity === '0.5' || tbody.style.opacity === '0.5') {
                tbody.style.opacity = '1';
                tbody.style.pointerEvents = 'auto';
            }
        });
    });
    // -------------------------

    window.tableSorts = {};

    window.handleSort = function (tableId, column) {
        if (!window.tableSorts[tableId]) {
            window.tableSorts[tableId] = { by: 'time', dir: 'desc' };
        }

        let currentSort = window.tableSorts[tableId];

        if (currentSort.by === column) {
            currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
        } else {
            currentSort.by = column;
            currentSort.dir = 'asc';
        }

        document.querySelectorAll(`.sort-indicator[id^="${tableId}-sort-"]`).forEach(el => el.innerHTML = '');
        const activeIndicator = document.getElementById(`${tableId}-sort-${column}`);
        if (activeIndicator) {
            activeIndicator.innerHTML = currentSort.dir === 'asc' ? 'â†‘' : 'â†“';
        }

        const loadFunc = window[`load${tableId.toUpperCase()}Data`];
        if (typeof loadFunc === 'function') {
            loadFunc(1);
        }
    };

    function setupTableLoading(tbody, colCount, onclickSearchStr, isDiv = false) {
        const refreshBtn = document.querySelector(`button[onclick*="${onclickSearchStr}"][title="Refresh"]`);
        const svg = refreshBtn ? refreshBtn.querySelector('svg') : null;
        if (svg) svg.classList.add('spinning');

        if (tbody) {
            const hasContent = tbody.children.length > 0 &&
                !tbody.querySelector('.empty-state') &&
                !tbody.innerHTML.includes('skeleton-cell') &&
                !tbody.innerText.includes('Loading');
            if (hasContent) {
                tbody.style.opacity = '0.5';
                tbody.style.pointerEvents = 'none';
                tbody.style.transition = 'opacity 0.15s ease-in-out';
                return { svg, tbody, fade: true, startTime: Date.now() };
            } else {
                if (isDiv === 'row') {
                    tbody.innerHTML = `<tr><td colspan="${colCount}" style="text-align:center;">Loading...</td></tr>`;
                } else if (isDiv) {
                    tbody.innerHTML = '<div style="padding: 20px; text-align: center; color: #94a3b8; font-size: 14px;">Loading...</div>';
                } else {
                    tbody.innerHTML = [1, 2, 3].map(() => `<tr>${Array(colCount).fill('<td><div class="skeleton-cell" style="width:90%;height:13px;"></div></td>').join('')}</tr>`).join('');
                }
                return { svg, tbody, fade: false, startTime: Date.now() };
            }
        }
        return { svg, tbody: null, fade: false, startTime: Date.now() };
    }

    function finishTableLoading(loadingState) {
        if (!loadingState) return;
        const elapsed = Date.now() - (loadingState.startTime || Date.now());
        const remaining = Math.max(0, 400 - elapsed);

        setTimeout(() => {
            if (loadingState.svg) loadingState.svg.classList.remove('spinning');
            if (loadingState.tbody && loadingState.fade) {
                loadingState.tbody.style.opacity = '1';
                loadingState.tbody.style.pointerEvents = 'auto';
            }
        }, remaining);
    }

    function openLogoutModal() { document.getElementById('modal-logout').classList.add('active'); }
    function closeLogoutModal() { document.getElementById('modal-logout').classList.remove('active'); }

    let confirmInterval = null;

    function showConfirmModal(message, onConfirm, countdownSeconds = 3) {
        document.getElementById('global-confirm-msg').innerText = message;
        const btn = document.getElementById('global-confirm-btn');
        const newBtn = btn.cloneNode(true);
        btn.parentNode.replaceChild(newBtn, btn);

        if (confirmInterval) clearInterval(confirmInterval);

        let timeLeft = countdownSeconds;
        newBtn.disabled = true;
        newBtn.innerText = `Confirm (${timeLeft})`;
        newBtn.style.cursor = 'not-allowed';
        newBtn.style.opacity = '0.7';

        confirmInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                newBtn.innerText = `Confirm (${timeLeft})`;
            } else {
                clearInterval(confirmInterval);
                newBtn.disabled = false;
                newBtn.innerText = 'Confirm';
                newBtn.style.cursor = 'pointer';
                newBtn.style.opacity = '1';
            }
        }, 1000);

        newBtn.addEventListener('click', () => {
            if (newBtn.disabled) return;
            closeConfirmModal();
            if (onConfirm) onConfirm();
        });
        document.getElementById('modal-global-confirm').classList.add('active');
    }

    function closeConfirmModal() {
        if (confirmInterval) clearInterval(confirmInterval);
        document.getElementById('modal-global-confirm').classList.remove('active');
    }

    function showAlertModal(title, message) {
        document.getElementById('global-alert-title').innerText = title;
        document.getElementById('global-alert-msg').innerText = message;
        document.getElementById('modal-global-alert').classList.add('active');
    }

    function closeAlertModal() {
        document.getElementById('modal-global-alert').classList.remove('active');
    }

    let selectedScheduleId = null;

    // â”€â”€â”€ MODULE SORT ORDER â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    const MODULE_ORDER = ['CRS', 'GMS', 'SPAMSI', 'SPAMSO', 'CB', 'FPCP', 'RUNNING'];

    document.addEventListener('DOMContentLoaded', () => {
        // Remove initial layout styles to allow normal class toggling
        const initialStyles = document.getElementById('initial-layout-styles');
        if (initialStyles) initialStyles.remove();

        // â”€â”€â”€ SIDEBAR NAVIGATION â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        const sidebarItems = document.querySelectorAll('.sidebar-item[data-panel]');
        const mainPanels = document.querySelectorAll('.main-panel');

        sidebarItems.forEach(item => {
            item.addEventListener('click', () => {
                const targetPanel = item.getAttribute('data-panel');

                sidebarItems.forEach(i => i.classList.remove('active'));
                item.classList.add('active');

                mainPanels.forEach(p => p.classList.remove('active'));
                const panel = document.getElementById(`panel-${targetPanel}`);
                if (panel) panel.classList.add('active');

                localStorage.setItem('admin_active_panel', targetPanel);

                // Auto-load data for the selected panel
                if (targetPanel === 'crs') { if (typeof loadCRSData === 'function') loadCRSData(1); }
                else if (targetPanel === 'gms') { if (typeof loadGMSData === 'function') loadGMSData(1); }
                else if (targetPanel === 'att') { if (typeof loadATTData === 'function') loadATTData(1); }
                else if (targetPanel === 'spamsi') { if (typeof loadSPAMSIData === 'function') loadSPAMSIData(1); }
                else if (targetPanel === 'spamso') { if (typeof loadSPAMSOData === 'function') loadSPAMSOData(1); }
                else if (targetPanel === 'wci') { if (typeof loadWCIData === 'function') loadWCIData(1); }
                else if (targetPanel === 'linestat') { if (typeof fetchLineStatus === 'function') fetchLineStatus(); }
                else if (targetPanel === 'prodtag') { if (typeof loadProdTagTracker === 'function') loadProdTagTracker(1); }
                else if (targetPanel === 'scoreboard') { if (typeof loadScoreboardData === 'function') loadScoreboardData(); }
                else if (targetPanel === 'partref') { 
                    if (typeof loadModels === 'function') loadModels(); 
                    if (typeof loadAllModelConfigs === 'function') loadAllModelConfigs(); 
                }
                else if (targetPanel === 'fgcp') { if (typeof loadTransferSlips === 'function') loadTransferSlips(1); }
                else if (targetPanel === 'qcreports') { if (typeof loadQCUnitsForPrint === 'function') loadQCUnitsForPrint(); }
                else if (targetPanel === 'insp3run') { if (typeof loadRITData === 'function') loadRITData(1); }
                else if (targetPanel === 'fit') { if (typeof loadFITData === 'function') loadFITData(1); }
                else if (targetPanel === 'pit') { if (typeof loadPITData === 'function') loadPITData(1); }
                else if (targetPanel === 'repair') { if (typeof loadRepairData === 'function') loadRepairData(1); }
                else if (targetPanel === 'cbpcb') { if (typeof loadCBPCBData === 'function') loadCBPCBData(1); }
                else if (targetPanel === 'insp3vib') { if (typeof loadINSP3VibData === 'function') loadINSP3VibData(1); }
                else if (targetPanel === 'worksched') { 
                    const dateDisplay = document.getElementById('sched-date-display');
                    if (dateDisplay) {
                        fetchSchedules(dateDisplay.innerText);
                        manageWorkSchedTimer();
                    }
                }
            });
        });

        // Date display logic
        const dateDisplay = document.getElementById('sched-date-display');
        if (dateDisplay) {
            const today = new Date();
            const formattedDate = `${String(today.getMonth() + 1).padStart(2, '0')}/${String(today.getDate()).padStart(2, '0')}/${today.getFullYear()}`;
            dateDisplay.innerText = formattedDate;
            fetchSchedules(formattedDate);
        }

        // Update sequence preview if Line changes in Add mode
        const schedLineDrop = document.getElementById('sched-line');
        if (schedLineDrop) {
            schedLineDrop.addEventListener('change', (e) => {
                const title = document.getElementById('schedule-modal-title').innerText;
                if (title === 'Add Work Schedule') {
                    document.getElementById('sched-seq-preview').value = 'Calculating...';
                    const currentDate = document.getElementById('sched-date-display').innerText;
                    fetch(`/admin/api/next-sequence?line_id=${e.target.value}&date=${encodeURIComponent(currentDate)}`)
                        .then(res => res.json())
                        .then(data => {
                            if (data.error || data.next_sequence === undefined) {
                                document.getElementById('sched-seq-preview').value = 'Error';
                            } else {
                                document.getElementById('sched-seq-preview').value = data.next_sequence;
                            }
                        })
                        .catch(() => {
                            document.getElementById('sched-seq-preview').value = 'Error';
                        });
                }
            });
        }

        // Load Model Reference initial data
        if (typeof loadModels === 'function') loadModels();

        // Load active lines for dropdowns
        loadActiveLines();
        loadActiveModulesAndTags();



        // Model Reference: auto-load BOM on dropdown change
        const mrModelSelect = document.getElementById('mr-model-select');
        if (mrModelSelect) mrModelSelect.addEventListener('change', () => loadBOM());

        // Scoreboard filter wiring
        // Legacy event listeners removed

        // Work Schedule filter wiring
        const schedLineFilter = document.getElementById('sched-line-filter');
        if (schedLineFilter) {
            schedLineFilter.addEventListener('change', () => {
                const dateDisplay = document.getElementById('sched-date-display');
                if (dateDisplay) {
                    fetchSchedules(dateDisplay.innerText);
                    manageWorkSchedTimer();
                }
            });
        }
    });

    let globalActiveLines = [];
    let lastIsMobile = null;

    function renderActiveLines() {
        const isMobile = window.innerWidth <= 768;
        if (lastIsMobile === isMobile) return; // Only re-render if crossing the breakpoint
        lastIsMobile = isMobile;

        const schedLine = document.getElementById('sched-line');
        const tsFilterLine = document.getElementById('ts-filter-line');
        const schedLineFilter = document.getElementById('sched-line-filter');
        const sbLineFilter = document.getElementById('sb-line-filter');
        const scoreboardLineSelector = document.getElementById('scoreboard-line-selector');
        const printQcLine = document.getElementById('print-qc-line');

        if (!globalActiveLines || globalActiveLines.length === 0) {
            const noLineHtml = '<option value="">-- No lines available --</option>';
            if (schedLine) schedLine.innerHTML = noLineHtml;
            if (tsFilterLine) tsFilterLine.innerHTML = noLineHtml;
            if (schedLineFilter) schedLineFilter.innerHTML = noLineHtml;
            if (sbLineFilter) sbLineFilter.innerHTML = noLineHtml;
            if (scoreboardLineSelector) scoreboardLineSelector.innerHTML = noLineHtml;
            if (printQcLine) printQcLine.innerHTML = noLineHtml;
        } else {
            let html = '';
            globalActiveLines.forEach(l => {
                const displayText = isMobile ? l.lineno : l.name;
                html += `<option value="${l.lineno}">${displayText}</option>`;
            });

            const preserveVal = (el, newHtml, addAll) => {
                if (!el) return;
                const val = el.value;
                el.innerHTML = (addAll ? '<option value="all">All</option>' : '') + newHtml;
                if (val && el.querySelector(`option[value="${val}"]`)) {
                    el.value = val;
                }
            };

            preserveVal(schedLine, html, false);
            preserveVal(tsFilterLine, html, true);
            preserveVal(schedLineFilter, html, true);
            preserveVal(sbLineFilter, html, true);
            preserveVal(scoreboardLineSelector, html, true);
            preserveVal(printQcLine, html, true);
        }
    }

    window.addEventListener('resize', () => {
        if (globalActiveLines.length > 0) renderActiveLines();
    });

    function loadActiveLines() {
        fetch('/api/lines/active')
            .then(res => res.json())
            .then(data => {
                globalActiveLines = data;
                lastIsMobile = null; // force render
                renderActiveLines();
            })
            .catch(err => console.error("Error fetching active lines:", err));
    }


    let workSchedRefreshTimer = null;
    
    function manageWorkSchedTimer() {
        if (workSchedRefreshTimer) {
            clearInterval(workSchedRefreshTimer);
            workSchedRefreshTimer = null;
        }
        const dateDisplay = document.getElementById('sched-date-display');
        if (!dateDisplay) return;
        const today = new Date();
        const formattedDate = `${String(today.getMonth() + 1).padStart(2, '0')}/${String(today.getDate()).padStart(2, '0')}/${today.getFullYear()}`;
        
        if (dateDisplay.innerText === formattedDate && document.getElementById('panel-worksched').classList.contains('active')) {
            workSchedRefreshTimer = setInterval(() => {
                fetchSchedules(dateDisplay.innerText, true);
            }, 10000);
        }
    }

    function fetchSchedules(date, isAutoRefresh = false) {
        manageWorkSchedTimer();
        
        const lineFilter = document.getElementById('sched-line-filter');
        const lineId = lineFilter ? lineFilter.value : 'all';
        const tbody = document.getElementById('sched-tbody');

        let loadingState = null;
        if (!isAutoRefresh) {
            loadingState = setupTableLoading(tbody, 7, 'fetchSchedules');
        }

        fetch(`/admin/api/schedules?date=${encodeURIComponent(date)}&line_id=${lineId}`)
            .then(res => res.json())
            .then(data => {
                if (!isAutoRefresh) finishTableLoading(loadingState);
                tbody.innerHTML = '';

                try {
                    if (data.wip_status) {
                        if (!isAutoRefresh) {
                            showWipModal(data.wip_status, lineId);
                        } else if (!wipModalDismissed && !document.getElementById('modal-wip').classList.contains('active')) {
                            showWipModal(data.wip_status, lineId);
                        }
                    }

                    document.getElementById('sched-total-qty').innerText = data.total_qty || 0;

                    let aveTakt = 0;
                    if (data.schedules && data.schedules.length > 0) {
                        const totalTakt = data.schedules.reduce((sum, sched) => sum + sched.takt_time, 0);
                        aveTakt = parseFloat((totalTakt / data.schedules.length).toFixed(2));
                    }
                    const aveTaktElement = document.getElementById('sched-ave-takt');
                    if (aveTaktElement) {
                        aveTaktElement.innerText = aveTakt;
                    }

                    if (data.schedules && data.schedules.length > 0) {
                        let normalIndex = 1;
                        data.schedules.forEach((sched) => {
                            const tr = document.createElement('tr');

                            if (sched.is_ghost) {
                                tr.style.opacity = '0.6';
                                tr.style.backgroundColor = '#f1f5f9';
                                tr.style.fontStyle = 'italic';
                                tr.innerHTML = `
                                <td>—</td>
                                <td>${sched.line_code}</td>
                                <td>—</td>
                                <td>${sched.model_number} <span class="badge-no-bom" style="background:#64748b;color:white;border-color:#64748b;">Past Work</span></td>
                                <td>${sched.planned_qty}</td>
                                <td>—</td>
                                <td>—</td>
                                `;
                                tr.style.cursor = 'pointer';
                                tr.onclick = () => {
                                    const dateStr = document.getElementById('sched-date-display').textContent;
                                    fetch(`/admin/api/schedules?date=${encodeURIComponent(dateStr)}&line_id=${sched.line_code}`)
                                        .then(r => r.json())
                                        .then(data => {
                                            if (data.wip_status && data.wip_status.active_date !== 'multiple') {
                                                showWipModal(data.wip_status, sched.line_code, true);
                                            } else {
                                                showLineStatusModal(sched.line_code);
                                            }
                                        });
                                };
                                tbody.appendChild(tr);
                                return; // skip standard click handler
                            }

                            tr.style.cursor = 'pointer';
                            tr.onclick = () => selectScheduleRow(tr, sched.id, sched);

                            if (sched.id === selectedScheduleId) {
                                tr.classList.add('selected');
                                currentScheduleData = sched;
                            }

                            // Bug Fix 1: orphaned model warning badge
                            const noBomBadge = sched.has_bom === false
                                ? `<span class="badge-no-bom" title="This model was deleted from Model Reference"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>No BOM</span>`
                                : '';

                            tr.innerHTML = `
                            <td>${normalIndex++}</td>
                            <td>${sched.line_code}</td>
                            <td>${sched.sort_order}</td>
                            <td>${sched.model_number}${noBomBadge}</td>
                            <td>${sched.planned_qty}</td>
                            <td>${sched.actual_qty}</td>
                            <td>${sched.takt_time}</td>
                        `;
                            tbody.appendChild(tr);
                        });
                    } else {
                        tbody.innerHTML = `
                        <tr>
                            <td colspan="7" class="empty-state">
                                <div class="empty-state-wrapper">
                                    <div class="empty-state-icon">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                            <line x1="16" y1="2" x2="16" y2="6"></line>
                                            <line x1="8" y1="2" x2="8" y2="6"></line>
                                            <line x1="3" y1="10" x2="21" y2="10"></line>
                                        </svg>
                                    </div>
                                    <h4 class="empty-state-title">No Schedules Found</h4>
                                    <span class="empty-state-sub">Select a different date or create a new schedule</span>
                                </div>
                        </td>
                    </tr>
                `;
                    }
                } catch (err) {
                    tbody.innerHTML = `<tr><td colspan="7" style="color:red; font-weight:bold; padding: 20px; text-align:center;">JS ERROR: ${err.message}<br/>${err.stack}</td></tr>`;
                    console.error("fetchSchedules rendering error:", err);
                }

                if (!isAutoRefresh && !data.schedules?.some(s => s.id === selectedScheduleId)) {
                    selectedScheduleId = null;
                    currentScheduleData = null;
                }
            })
            .catch(err => {
                tbody.innerHTML = `<tr><td colspan="7" style="color:red; font-weight:bold; padding: 20px; text-align:center;">API/NETWORK ERROR: ${err.message}</td></tr>`;
                showToast("Failed to load schedules", "error");
                console.error("fetchSchedules network error:", err);
            });
    }

    let currentScheduleData = null;

    function selectScheduleRow(row, id, schedData) {
        const wasSelected = row.classList.contains('selected');
        document.querySelectorAll('#sched-tbody tr').forEach(tr => {
            tr.classList.remove('selected');
        });

        if (wasSelected) {
            selectedScheduleId = null;
            currentScheduleData = null;
        } else {
            row.classList.add('selected');
            selectedScheduleId = id;
            currentScheduleData = schedData;
        }
    }

    // â”€â”€â”€ Populate sched-model dropdown from DB â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function loadScheduleModelDropdown(selectedValue, takenModels = new Set()) {
        return fetch('/admin/api/models')
            .then(res => res.json())
            .then(data => {
                const select = document.getElementById('sched-model');
                select.innerHTML = '<option value="">-- Select Model --</option>';
                let found = false;
                data.forEach(model => {
                    if (model.model_number === selectedValue) found = true;
                    const opt = document.createElement('option');
                    const isTaken = takenModels.has(model.model_number);
                    opt.value = model.model_number;
                    opt.textContent = isTaken
                        ? `${model.model_number}  (Already Scheduled)`
                        : model.model_number;
                    if (isTaken) {
                        opt.style.color = '#dc2626';
                        opt.style.fontWeight = '600';
                        opt.dataset.taken = '1';
                    }
                    select.appendChild(opt);
                });
                if (selectedValue && !found) {
                    const opt = document.createElement('option');
                    opt.value = selectedValue;
                    opt.textContent = selectedValue;
                    select.appendChild(opt);
                }
                if (selectedValue) {
                    select.value = selectedValue;
                }
                // Apply red border warning whenever a taken model is selected
                _applySchedSelectWarning(select, takenModels);
            });
    }

    // Helper: red border + inline warning when a taken model is chosen
    function _applySchedSelectWarning(select, takenModels) {
        const update = () => {
            const warn = takenModels.has(select.value);
            select.style.borderColor = warn ? '#dc2626' : '';
            select.style.boxShadow = warn ? '0 0 0 3px rgba(220,38,38,.15)' : '';
            select.style.color = warn ? '#dc2626' : '';

            let lbl = document.getElementById('sched-model-warn');
            if (warn) {
                if (!lbl) {
                    lbl = document.createElement('div');
                    lbl.id = 'sched-model-warn';
                    lbl.style.cssText =
                        'font-size:12px;color:#dc2626;font-weight:600;margin-top:4px;'
                        + 'display:flex;align-items:center;gap:4px;';
                    lbl.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13"
                         viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                        <line x1="12" y1="9" x2="12" y2="13"/>
                        <line x1="12" y1="17" x2="12.01" y2="17"/>
                    </svg>
                    This model is already scheduled for today!`;
                    select.after(lbl);
                }
            } else if (lbl) {
                lbl.remove();
            }
        };
        // Swap the handler each call so there are no duplicate listeners
        select.removeEventListener('change', select._warnHandler);
        select._warnHandler = update;
        select.addEventListener('change', select._warnHandler);
        update(); // run once immediately
    }

            // Default to L1 if 'all' is selected

    function openScheduleModalContinue(mode, targetLine, currentSchedules = []) {

        const modal = document.getElementById('modal-schedule');
        const title = document.getElementById('schedule-modal-title');
        const saveBtn = document.getElementById('sched-save-btn');

        // Set Date Preview
        const currentDate = document.getElementById('sched-date-display').innerText;
        document.getElementById('sched-date-preview').value = currentDate;

        if (mode === 'edit') {
            if (!selectedScheduleId) {
                showToast("Please select a schedule to edit.", "error");
                return;
            }
            // is_locked no longer prevents opening the modal to edit quantity

            title.innerText = 'Edit Work Schedule';
            saveBtn.innerText = 'Save Changes';

            document.getElementById('sched-id').value = currentScheduleData.id;
            document.getElementById('sched-seq-preview').value = currentScheduleData.sort_order;
            document.getElementById('sched-qty').value = currentScheduleData.planned_qty;
            document.getElementById('sched-takt').value = currentScheduleData.takt_time;
            
            // Show Set to CRS button if applicable
            const btnCrs = document.getElementById('sched-btn-crs');
            if (currentScheduleData.crs_qty > 0 && currentScheduleData.crs_qty < currentScheduleData.planned_qty) {
                btnCrs.style.display = 'block';
            } else {
                btnCrs.style.display = 'none';
            }
            if (window.checkSchedQtyWarning) window.checkSchedQtyWarning();

            // Populate dropdown then set the selected value
            loadScheduleModelDropdown(currentScheduleData.model_number).then(() => {
                document.getElementById('sched-line').value = currentScheduleData.line_code;
                const modelDropdown = document.getElementById('sched-model');
                if (currentScheduleData.is_queued_at_crs || currentScheduleData.is_locked) {
                    modelDropdown.disabled = true;
                } else {
                    modelDropdown.disabled = false;
                }
            });
        } else {
            title.innerText = 'Add Work Schedule';
            saveBtn.innerText = 'Add';
            document.getElementById('sched-model').disabled = false;

            document.getElementById('sched-id').value = '';
            document.getElementById('sched-seq-preview').value = 'Calculating...';

            // Load dropdown directly, we allow multiple sequences of the same model now
            const takenModels = new Set(currentSchedules.map(s => s.model_number));
            loadScheduleModelDropdown('', takenModels).then(() => {
                _applySchedSelectWarning(document.getElementById('sched-model'), takenModels);
            });

            // Fetch next sequence
            fetch(`/admin/api/next-sequence?line_id=${targetLine}&date=${encodeURIComponent(currentDate)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.error || data.next_sequence === undefined) {
                        document.getElementById('sched-seq-preview').value = 'Error';
                    } else {
                        document.getElementById('sched-seq-preview').value = data.next_sequence;
                    }
                })
                .catch(() => {
                    document.getElementById('sched-seq-preview').value = 'Error';
                });

            document.getElementById('sched-qty').value = '';
            document.getElementById('sched-takt').value = '';
            document.getElementById('sched-btn-crs').style.display = 'none';
            if (window.checkSchedQtyWarning) window.checkSchedQtyWarning();
        }

        modal.classList.add('active');
    };

    window.saveSchedule = function (force = false) {
        const id = document.getElementById('sched-id').value;
        const dateDisplay = document.getElementById('sched-date-display').innerText;

        const payload = {
            line_id: document.getElementById('sched-line').value,
            model_number: document.getElementById('sched-model').value,
            planned_qty: parseInt(document.getElementById('sched-qty').value),
            takt_time: parseFloat(document.getElementById('sched-takt').value),
            date: dateDisplay,
            force: force
        };

        if (!payload.model_number || payload.model_number.trim() === '') {
            showToast("Please select a Model.", 'error');
            return;
        }

        if (isNaN(payload.planned_qty) || payload.planned_qty <= 0) {
            showToast("Valid Planned Quantity is required.", 'error');
            return;
        }

        if (isNaN(payload.takt_time) || payload.takt_time <= 0) {
            showToast("Valid Takt Time is required.", 'error');
            return;
        }

        const url = id ? `/admin/api/schedule/${id}` : `/admin/api/schedule`;
        const method = id ? 'PUT' : 'POST';

        fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
            .then(res => res.json().then(data => ({ status: res.status, data })))
            .then(({ status, data }) => {
                if (data.success) {
                    closeScheduleModal();
                    fetchSchedules(dateDisplay);
                    showToast("Schedule saved successfully.", 'success');
                } else if (data.requires_confirmation) {
                    showConfirmModal(data.message, () => {
                        window.saveSchedule(true);
                    });
                } else if (data.error === 'duplicate') {
                    // Show a prominent inline error — do NOT close the modal
                    showToast(data.message || "Duplicate model: please edit the existing entry.", 'error', 6000);
                } else {
                    showToast(data.error || "Error saving schedule.", 'error', 6000);
                }
            })
            .catch(() => showToast("Network error. Please try again.", 'error'));
    };

    let _msAllRows = [];   // full row data for filter

    window.openModuleScheduleModal = function () {
        const date = document.getElementById('sched-date-display').innerText;
        const lineId = document.getElementById('sched-line-filter').value || 1;
        const lineno = lineId === 'all' ? 'All Lines' : lineId;

        document.getElementById('ms-date-display').textContent = date;

        document.getElementById('modal-module-sched').classList.add('active');

        // Fetch schedules + BOM module data in parallel
        Promise.all([
            fetch(`/admin/api/schedules?date=${encodeURIComponent(date)}&line_id=${lineId}`).then(r => r.json()),
            fetch('/admin/api/models').then(r => r.json())
        ]).then(([schedData, models]) => {
            const scheds = schedData.schedules || [];

            if (scheds.length === 0) {
                _msAllRows = [];
                document.getElementById('ms-tbody').innerHTML =
                    `<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--text-secondary);">No schedules for this date / line.</td></tr>`;
                return;
            }

            // Fetch BOM for each unique model to get module info
            const uniqueModels = [...new Set(scheds.map(s => s.model_number))];
            const bomPromises = uniqueModels.map(m =>
                fetch(`/admin/api/bom?modelcode=${encodeURIComponent(m)}`).then(r => r.json()).then(d => ({
                    model: m,
                    modules: [...new Set((d.parts || []).map(p => p.module_code).filter(Boolean))]
                }))
            );

            Promise.all(bomPromises).then(bomResults => {
                const moduleMap = {};
                const allModulesSet = new Set();
                
                bomResults.forEach(b => { 
                    const mods = new Set(b.modules);
                    // Main line stations are applicable to all scheduled models
                    ['ATT', 'WCI', 'RIT', 'FIT', 'PIT'].forEach(m => mods.add(m));
                    moduleMap[b.model] = Array.from(mods);
                    moduleMap[b.model].forEach(m => allModulesSet.add(m));
                });

                const select = document.getElementById('ms-module-filter');
                select.innerHTML = '<option value="All">All</option>';
                Array.from(allModulesSet).sort().forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m;
                    opt.innerText = m;
                    select.appendChild(opt);
                });

                _msAllRows = scheds.map(s => ({
                    id: s.id,
                    seq: s.sort_order,
                    model: s.model_number,
                    plan: s.planned_qty,
                    act: s.actual_qty,
                    modules: moduleMap[s.model_number] || []
                }));

                _msSelected = null;
                renderModuleSchedTable(_msAllRows);
            });
        }).catch(() => {
            document.getElementById('ms-tbody').innerHTML =
                `<tr><td colspan="5" style="text-align:center;padding:24px;color:#ef4444;">Failed to load data.</td></tr>`;
        });
    };

    function loadModels() {
        return fetch('/admin/api/models')
            .then(res => res.json())
            .then(data => {
                const selectMR = document.getElementById('mr-model-select');
                const selectSS = document.getElementById('ss-modelcode');

                const currentMRValue = selectMR ? selectMR.value : '';
                const currentSSValue = selectSS ? selectSS.value : '';

                if (selectMR) selectMR.innerHTML = '<option value="">-- Select Model --</option>';
                if (selectSS) selectSS.innerHTML = '<option value="">-- Select Model --</option>';

                data.forEach(model => {
                    const displayText = model.is_on_schedule ? `${model.model_number} [ON SCHEDULE]` : model.model_number;
                    if (selectMR) {
                        const opt = document.createElement('option');
                        opt.value = model.model_number;
                        opt.textContent = displayText;
                        if (model.is_on_schedule) {
                            opt.style.color = '#d32f2f'; // Red color for locked items
                            opt.dataset.onSchedule = "true";
                        }
                        selectMR.appendChild(opt);
                    }
                    if (selectSS) {
                        const opt = document.createElement('option');
                        opt.value = model.model_number;
                        opt.textContent = displayText;
                        if (model.is_on_schedule) {
                            opt.style.color = '#d32f2f';
                            opt.dataset.onSchedule = "true";
                        }
                        selectSS.appendChild(opt);
                    }
                });

                // Helper to update the actual select element's color
                const updateSelectColor = (selectEl) => {
                    if (!selectEl) return;
                    const selectedOpt = selectEl.options[selectEl.selectedIndex];
                    if (selectedOpt && selectedOpt.text.includes('[ON SCHEDULE]')) {
                        selectEl.style.color = '#d32f2f';
                        selectEl.style.fontWeight = 'bold';
                    } else {
                        selectEl.style.color = '';
                        selectEl.style.fontWeight = '';
                    }
                };

                // Restore selection if it still exists
                if (selectMR && currentMRValue) selectMR.value = currentMRValue;
                if (selectSS && currentSSValue) selectSS.value = currentSSValue;
                
                updateSelectColor(selectMR);
                updateSelectColor(selectSS);
                
                // Ensure event listeners are attached to update color on change
                if (selectMR && !selectMR.dataset.colorListenerAttached) {
                    selectMR.addEventListener('change', function() { updateSelectColor(this); });
                    selectMR.dataset.colorListenerAttached = 'true';
                }
                if (selectSS && !selectSS.dataset.colorListenerAttached) {
                    selectSS.addEventListener('change', function() { updateSelectColor(this); });
                    selectSS.dataset.colorListenerAttached = 'true';
                }
            });
    }

        if (!modelcode) {
            tbody.innerHTML = `
            <tr>
                <td colspan="5" class="empty-state">
                    <div class="empty-state-wrapper">
                        <h4 class="empty-state-title">No Model Selected</h4>
                        <p class="empty-state-desc">Select a model from the dropdown above to view its Bill of Materials (BOM) details.</p>
                    </div>
                </td>
            </tr>
        `;
            document.getElementById('bom-action-btns').style.display = 'none';
            return;
        }

        const loadingState = setupTableLoading(tbody, 6, 'loadBOM');
        document.getElementById('bom-action-btns').style.display = 'none';

        fetch(`/admin/api/bom?modelcode=${encodeURIComponent(modelcode)}`)
            .then(res => res.json())
            .then(data => {
                finishTableLoading(loadingState);
                const moduleFilter = document.getElementById('mr-module-filter').value;
                let partsToRender = data.parts || [];
                if (moduleFilter !== 'All') {
                    partsToRender = partsToRender.filter(p => p.module_code === moduleFilter);
                }

                if (partsToRender.length > 0) {
                    tbody.innerHTML = '';

                    // Sort by fixed module order
                    const sorted = [...partsToRender].sort((a, b) => {
                        const ai = MODULE_ORDER.indexOf(a.module_code);
                        const bi = MODULE_ORDER.indexOf(b.module_code);
                        const aRank = ai === -1 ? MODULE_ORDER.length : ai;
                        const bRank = bi === -1 ? MODULE_ORDER.length : bi;
                        return aRank - bRank;
                    });

                    const moduleColors = {
                        'CRS': { bg: '#e0f2fe', text: '#0369a1' },
                        'GMS': { bg: '#ecfccb', text: '#4d7c0f' },
                        'SPAMSI': { bg: '#fce7f3', text: '#be185d' },
                        'SPAMSO': { bg: '#ffedd5', text: '#c2410c' }
                    };

                    const moduleNames = {
                        'CRS': 'Compressor Registration System',
                        'GMS': 'Gas Management System',
                        'SPAMSI': 'Safety Parts Management System (Indoor)',
                        'SPAMSO': 'Safety Parts Management System (Outdoor)'
                    };

                    let lastModule = null;
                    let rowIndex = 0;
                    sorted.forEach(part => {
                        const colors = moduleColors[part.module_code] || { bg: 'var(--bg-main)', text: 'var(--text-primary)' };
                        const displayName = moduleNames[part.module_code] || part.module_code;

                        if (part.module_code !== lastModule) {
                            const groupRow = document.createElement('tr');
                            groupRow.style.pointerEvents = 'none';
                            groupRow.innerHTML = `
                            <td colspan="6" style="
                                background: ${colors.bg};
                                padding: 0.35rem 1rem;
                                font-size: 0.7rem;
                                font-weight: 700;
                                letter-spacing: 0.08em;
                                text-transform: uppercase;
                                color: ${colors.text};
                                border-bottom: 1px solid var(--border-light);
                            ">${displayName}</td>
                        `;
                            tbody.appendChild(groupRow);
                            lastModule = part.module_code;
                        }

                        const tr = document.createElement('tr');
                        // Bug Fix 2: entrance animation with staggered delay
                        tr.className = 'bom-row';
                        if (part.module_code) {
                            tr.className += ' bom-row-' + part.module_code.toLowerCase();
                        }
                        tr.style.animationDelay = `${rowIndex * 30}ms`;
                        tr.style.cursor = 'pointer';
                        tr.onclick = function () { selectBomRow(this, part.id, part); };
                        tr.innerHTML = `
                        <td>${rowIndex + 1}</td>
                        <td style="font-weight: 600; color: ${colors.text};">${part.module_code}</td>
                        <td>${part.part_number}</td>
                        <td>${part.description}</td>
                        <td>${part.usage_qty}</td>
                        <td>${part.tag}</td>
                    `;
                        tbody.appendChild(tr);
                        rowIndex++;
                    });

                    document.getElementById('bom-action-btns').style.display = 'flex';
                    selectedBomId = null;
                    currentBomData = null;
                } else {
                    tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="empty-state" style="text-align: center; padding: 2rem;">
                            No parts found for this model.
                        </td>
                    </tr>
                `;
                    document.getElementById('bom-action-btns').style.display = 'flex';
                }
            })
            .catch(() => {
                finishTableLoading(loadingState);
                tbody.innerHTML = `<tr><td colspan="5" class="empty-state">Failed to load BOM data.</td></tr>`;
            });
    };

    window.loadAreaOptions = function (selectedArea) {

            .then(res => res.ok ? res.json() : [])
            .then(areas => {
                document.querySelectorAll('#bom-new-area, #mc-area').forEach(select => {
                    const selected = selectedArea !== undefined ? selectedArea : select.value;
                    select.innerHTML = '';
                    if (areas.length === 0) {
                        select.innerHTML = '<option value="">No active areas configured</option>';
                        return;
                    }
                    areas.forEach(area => {
                        const option = new Option(area.name, area.name, false, area.name === selected);
                        select.add(option);
                    });
                    if (select.id === 'mc-area' && selected && !areas.some(area => area.name === selected)) {
                        select.add(new Option(`${selected} (inactive)`, selected, true, true));
                    }
                });
                return areas;
            })
            .catch(() => {
                document.querySelectorAll('#bom-new-area, #mc-area').forEach(select => {

    window.saveModelConfig = function () {
        const modelcode = document.getElementById('mc-modelcode').value;

        // Validate SPAMSI Unique Code is provided
        const spamsiCodeInput = document.getElementById('mc-spamsi-unique-code');
        const spamsiCode = (spamsiCodeInput.value || '').trim();

        if (!spamsiCode) {
            spamsiCodeInput.style.borderColor = '#dc2626';
            spamsiCodeInput.focus();
            showToast('SPAMSI Unique Code is required', 'error');
            return;
        }

        spamsiCodeInput.style.borderColor = 'var(--border-light)';

        let payload = {
            area: document.getElementById('mc-area').value,
            serialstart: document.getElementById('mc-serialstart').value,
            spamsi_unique_code: spamsiCode,
            program_h: document.getElementById('mc-progh').value === ':' ? null : document.getElementById('mc-progh').value,
            program_f: document.getElementById('mc-progf').value === ':' ? null : document.getElementById('mc-progf').value,
            gascharge_base: document.getElementById('mc-gc-base').value,
            gmstolpos: document.getElementById('mc-gas-pos').value,
            gmstolneg: document.getElementById('mc-gas-neg').value,
            op_current_base: document.getElementById('mc-opc-base').value,
            op_current_tolpos: document.getElementById('mc-opc-pos').value,
            op_current_tolneg: document.getElementById('mc-opc-neg').value,
            in_power_base: document.getElementById('mc-inp-base').value,
            in_power_tolpos: document.getElementById('mc-inp-pos').value,
            in_power_tolneg: document.getElementById('mc-inp-neg').value,
            temp_diff_base: document.getElementById('mc-tmp-base').value,
            temp_diff_tolpos: document.getElementById('mc-tmp-pos').value,
            temp_diff_tolneg: document.getElementById('mc-tmp-neg').value,
            ritheat1: document.getElementById('mc-ritheat1') ? document.getElementById('mc-ritheat1').value : null,
            ritheat2: document.getElementById('mc-ritheat2') ? document.getElementById('mc-ritheat2').value : null,
            pittws: document.getElementById('mc-pittws') ? document.getElementById('mc-pittws').value : null
        };

        fetch(`/admin/api/modelref/${encodeURIComponent(modelcode)}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(res => res.json()).then(data => {
            if (data.success) {
                showToast("Configuration saved.", "success");
                closeModelConfigModal();
                if (typeof loadAllModelConfigs === 'function') loadAllModelConfigs();
            } else {
                showToast(data.error || "Error saving configuration.", "error");

        }).catch(err => {
            showToast("An error occurred.", "error");
            console.error(err);
        });
    };

    window.validateModuleTags = function (modelcode) {
        fetch(`/admin/api/bom?modelcode=${encodeURIComponent(modelcode)}`)
            .then(res => res.json())
            .then(data => {
                let parts = data.parts || [];
                let modules = [...new Set(parts.map(p => p.module_code))];
                let warnings = [];

                if (modules.includes('CRS')) {
                    let crsParts = parts.filter(p => p.module_code === 'CRS');
                    let tags = crsParts.map(p => p.tag);
                    if (!tags.includes('Compressor') || !tags.includes('Fan Motor') || !tags.includes('Safety Part')) {
                        warnings.push("CRS module missing required tags (Compressor, Fan Motor, Safety Part).");
                    }
                }
                if (modules.includes('GMS')) {
                    let gmsParts = parts.filter(p => p.module_code === 'GMS');
                    let tags = gmsParts.map(p => p.tag);
                    if (!tags.includes('Gas Charge')) {
                        warnings.push("GMS module missing required tag (Gas Charge).");
                    }
                }
                if (modules.includes('SPAMSI')) {
                    let spamsiParts = parts.filter(p => p.module_code === 'SPAMSI');
                    let tags = spamsiParts.map(p => p.tag);
                    if (!tags.includes('Safety Part')) {
                        warnings.push("SPAMSI module missing required tag (Safety Part).");
                    }
                }
                if (modules.includes('SPAMSO')) {
                    let spamsoParts = parts.filter(p => p.module_code === 'SPAMSO');
                    let tags = spamsoParts.map(p => p.tag);
                    if (!tags.includes('Safety Part') && !tags.includes('Outdoor Control Board')) {
                        warnings.push("SPAMSO module missing required tag (Outdoor Control Board or Safety Part).");
                    }
                }

                if (warnings.length > 0) {
                    showToast("Tag Warnings:\n" + warnings.join("\n"), 'error', 8000);
                }
            });
    };

        const isNewModelMode = document.getElementById('bom-model-input-group').style.display !== 'none';

        if (!isNewModelMode) return true;

        const exists = Array.from(document.getElementById('mr-model-select').options)

    window.formatProgramCode = function (input) {
        let digits = input.value.replace(/\D/g, '');
        let left = digits.substring(0, 2);
        let right = digits.substring(2, 4);
        input.value = left + ':' + right;
    };

    window.padProgramCode = function (input) {
        let digits = input.value.replace(/\D/g, '');
        if (digits.length > 0) {
            let left = digits.substring(0, 2).padStart(2, '0');
            let right = digits.substring(2, 4).padEnd(2, '0');
            input.value = left + ':' + right;
        } else {
            input.value = ':';
        }
    };

    window.handleModuleChange = function (selectElem) {
        window.toggleOtherInput(selectElem, selectElem.nextElementSibling);
        if (window.toggleGasTolerance) window.toggleGasTolerance(selectElem);

        const row = selectElem.closest('.bom-part-row');
        let module = selectElem.value;
        if (module === 'Other') module = selectElem.nextElementSibling.value;

        let nextTag = null;
        if (module === 'GMS') nextTag = 'Gas Charge';
        else if (module === 'SPAMSI') nextTag = 'Safety Part';
        else if (module === 'SPAMSO') nextTag = 'Outdoor Control Board';
        else if (module === 'CRS') {
            const container = document.getElementById('bom-parts-container');
            const sequence = ['Compressor', 'Fan Motor', 'Safety Part'];
            let highestIndex = -1;
            const rows = container.querySelectorAll('.bom-part-row');
            for (let i = 0; i < rows.length; i++) {
                const r = rows[i];
                if (r === row) continue;
                let m = r.querySelector('.part-module').value;
                if (m === 'Other') m = r.querySelector('.part-module-other').value;
                if (m === 'CRS') {
                    let t = r.querySelector('.part-tag').value;
                    if (t === 'Other') t = r.querySelector('.part-tag-other').value;
                    const idx = sequence.indexOf(t);
                    if (idx > highestIndex) highestIndex = idx;
                }
            }
            if (highestIndex >= 0 && highestIndex < sequence.length - 1) {
                nextTag = sequence[highestIndex + 1];
            } else if (highestIndex === sequence.length - 1) {
                nextTag = 'Safety Part';
            } else {
                nextTag = 'Compressor';
            }
        }

        if (nextTag) {
            const tagSelect = row.querySelector('.part-tag');
            const tagOther = row.querySelector('.part-tag-other');
            if (Array.from(tagSelect.options).some(opt => opt.value === nextTag)) {
                tagSelect.value = nextTag;
                tagOther.style.display = 'none';
                tagOther.value = '';
            } else {
                tagSelect.value = 'Other';
                tagOther.style.display = '';
                tagOther.value = nextTag;
            }
        }
    };

    window.saveBom = function () {
        if (!window.validateNewModelCode()) {
            showToast("Model already exists. Please select it from the dropdown.", 'error');
            return;
        }
        const id = document.getElementById('bom-id').value;
        const modelcode = document.getElementById('bom-model').value;

        const container = document.getElementById('bom-parts-container');
        const rows = container.querySelectorAll('.bom-part-row');
        if (rows.length === 0) {
            showToast("Please add at least one part.", "error");
            return;
        }

        const payloads = [];
        let hasError = false;

        rows.forEach(row => {
            row.style.borderColor = 'var(--border-light)';

            let selectedModule = row.querySelector('.part-module').value;
            if (selectedModule === 'Other') selectedModule = row.querySelector('.part-module-other').value.trim();

            let selectedTag = row.querySelector('.part-tag').value;
            if (selectedTag === 'Other') selectedTag = row.querySelector('.part-tag-other').value.trim();

            const partno = row.querySelector('.part-no').value.trim();
            const desc = row.querySelector('.part-desc').value.trim();
            const usage = parseFloat(row.querySelector('.part-usage').value) || 1;

            if (!modelcode || !partno || !selectedModule) {
                row.style.borderColor = '#dc2626';
                hasError = true;
                return;
            }

            payloads.push({
                rowElement: row,
                data: {
                    modelcode: modelcode,
                    module: selectedModule,
                    partno: partno,
                    partdesc: desc,
                    usage: usage,
                    tag: selectedTag
                }
            });
        });

        if (hasError) {
            showToast("Please fill all required fields (Part Number, Module) in all rows.", "error");
            return;
        }

        const url = id ? `/admin/api/bom/${id}` : `/admin/api/bom`;
        const method = id ? 'PUT' : 'POST';

        document.getElementById('bom-save-btn').disabled = true;

        // Save the new model configuration if creating a new model
        let modelConfigPromise = Promise.resolve();
        const newModelConfigDiv = document.getElementById('bom-new-model-config');
        let configPayload = null;

        if (!id && newModelConfigDiv && newModelConfigDiv.style.display !== 'none') {
            // Validate SPAMSI Unique Code is required for new models
            const spamsiCodeInput = document.getElementById('bom-new-spamsi-unique-code');
            const spamsiCode = (spamsiCodeInput.value || '').trim();

            if (!spamsiCode) {
                spamsiCodeInput.style.borderColor = '#dc2626';
                spamsiCodeInput.focus();
                showToast('SPAMSI Unique Code is required for new models', 'error');
                document.getElementById('bom-save-btn').disabled = false;
                return;
            }

            spamsiCodeInput.style.borderColor = 'var(--border-light)';

            configPayload = {
                area: document.getElementById('bom-new-area').value,
                serialstart: document.getElementById('bom-new-serial').value,
                spamsi_unique_code: spamsiCode,
                program_h: document.getElementById('bom-new-progh').value === ':' ? null : document.getElementById('bom-new-progh').value,
                program_f: document.getElementById('bom-new-progf').value === ':' ? null : document.getElementById('bom-new-progf').value,
                gascharge_base: '',
                gmstolpos: '',
                gmstolneg: '',
                op_current_base: document.getElementById('bom-new-opc-base').value,
                op_current_tolpos: document.getElementById('bom-new-opc-pos').value,
                op_current_tolneg: document.getElementById('bom-new-opc-neg').value,
                in_power_base: document.getElementById('bom-new-inp-base').value,
                in_power_tolpos: document.getElementById('bom-new-inp-pos').value,
                in_power_tolneg: document.getElementById('bom-new-inp-neg').value,
                temp_diff_base: document.getElementById('bom-new-tmp-base').value,
                temp_diff_tolpos: document.getElementById('bom-new-tmp-pos').value,
                temp_diff_tolneg: document.getElementById('bom-new-tmp-neg').value,
                ritheat1: document.getElementById('bom-new-ritheat1') ? document.getElementById('bom-new-ritheat1').value : null,
                ritheat2: document.getElementById('bom-new-ritheat2') ? document.getElementById('bom-new-ritheat2').value : null,
                pittws: document.getElementById('bom-new-pittws') ? document.getElementById('bom-new-pittws').value : null
            };
        }

        // Find if any row is GMS and extract its Gas Charge Tolerance
        const gmsRow = Array.from(rows).find(r => {
            let m = r.querySelector('.part-module').value;
            if (m === 'Other') m = r.querySelector('.part-module-other').value.trim();
            return m === 'GMS';
        });

        // If there's a GMS row but the user left the global gas charge fields blank, fallback to the row's tolerances
        if (gmsRow) {
            if (!configPayload) configPayload = {};
            if (!configPayload.gascharge_base) configPayload.gascharge_base = gmsRow.querySelector('.part-usage').value;
            if (!configPayload.gmstolpos) configPayload.gmstolpos = gmsRow.querySelector('.part-gas-pos').value;
            if (!configPayload.gmstolneg) configPayload.gmstolneg = gmsRow.querySelector('.part-gas-neg').value;
        }

        if (configPayload) {
            modelConfigPromise = fetch(`/admin/api/modelref/${encodeURIComponent(modelcode)}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(configPayload)
            }).then(res => res.json()).then(data => {
                if (!data.success) throw new Error(data.error || 'Failed to save model configuration.');
                return data;
            });
        }

        modelConfigPromise.then(() => {
            return Promise.all(payloads.map(p => {
                return fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(p.data)
                }).then(res => res.json()).then(data => ({ success: data.success, data: data, row: p.rowElement }));
            }));
        }).then(results => {
            let allSuccess = true;
            let errMsgs = [];

            results.forEach(res => {
                if (res.success) {
                    res.row.remove(); // Remove successful rows
                } else {
                    allSuccess = false;
                    res.row.style.borderColor = '#dc2626'; // Highlight failed row
                    errMsgs.push(res.data.error || res.data.message || "Error saving part.");
                }
            });

            document.getElementById('bom-save-btn').disabled = false;
            if (typeof loadAllModelConfigs === 'function') loadAllModelConfigs();

            if (allSuccess) {
                showToast("All parts saved successfully.", 'success');
                closeBomModal();
                loadModels().then(() => {
                    const mrSelect = document.getElementById('mr-model-select');
                    if (mrSelect) {
                        mrSelect.value = modelcode;
                    }
                    loadBOM();
                });
            } else {
                showToast(`Some parts failed to save:<br>${errMsgs.join('<br>')}`, 'error', 5000);
            }
        }).catch(err => {
            document.getElementById('bom-save-btn').disabled = false;
            showToast(err.message || "Failed to save model configuration or parts.", "error");
            console.error(err);
        });
    };

    function loadActiveModulesAndTags() {
        // Load Modules
        fetch('/api/modules/active')
            .then(res => res.json())
            .then(data => {
                window.activeModules = data;
                const msModuleFilter = document.getElementById('ms-module-filter');
                const mrModuleFilter = document.getElementById('mr-module-filter');

                function updateFilter(filterEl) {
                    if (!filterEl) return;
                    const currentVal = filterEl.value;
                    const allOpt = Array.from(filterEl.options).find(o => o.value === 'All') || new Option('All Modules', 'All');
                    filterEl.innerHTML = '';
                    filterEl.appendChild(allOpt);
                    data.forEach(m => {
                        const opt = document.createElement('option');
                        opt.value = m.name; opt.textContent = m.name;
                        filterEl.appendChild(opt);
                    });
                    if (Array.from(filterEl.options).some(o => o.value === currentVal)) {
                        filterEl.value = currentVal;
                    }
                }

                updateFilter(msModuleFilter);
                updateFilter(mrModuleFilter);
            })
            .catch(err => console.error('Error loading modules:', err));

        // Load Tags
        fetch('/api/tags/active')
            .then(res => res.json())
            .then(data => {
                window.activeTags = data;
            })
            .catch(err => console.error('Error loading tags:', err));
    }

    document.addEventListener('DOMContentLoaded', () => {

    function showToast(message, type = 'success', duration = 3500) {
        const toast = document.getElementById('toast');
        if (!toast) return;

        toast.innerHTML = message;
        toast.className = 'toast toast-' + type + ' toast-show';

        clearTimeout(toast._hideTimer);
        toast._hideTimer = setTimeout(() => {
            toast.classList.remove('toast-show');
        }, duration);
    }

    window.handleSort = function (tableId, column) {
        const state = tableSorts[tableId];
        if (state.by === column) {
            state.dir = state.dir === 'asc' ? 'desc' : 'asc';
        } else {
            state.by = column;
            state.dir = 'desc'; // Default to desc when changing column
        }

        // Update sort indicators
        document.querySelectorAll(`#${tableId}-table .sort-indicator`).forEach(el => el.innerHTML = '');
        const indicator = document.getElementById(`${tableId}-sort-${column}`);
        if (indicator) {
            indicator.innerHTML = state.dir === 'asc'
                ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"></polyline></svg>'
                : '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>';
        }

        // Trigger data load based on table
        if (tableId === 'crs') loadCRSData(1);
        else if (tableId === 'gms') loadGMSData(1);
        else if (tableId === 'att') loadATTData(1);
        else if (tableId === 'spamsi') loadSPAMSIData(1);
        else if (tableId === 'spamso') loadSPAMSOData(1);
        else if (tableId === 'cbpcb') loadCBPCBData(1);
        else if (tableId === 'wci') loadWCIData(1);
        else if (tableId === 'insp3run') loadRITData(1);
        else if (tableId === 'insp3vib') loadINSP3VibData(1);
        else if (tableId === 'fit') loadFITData(1);
        else if (tableId === 'pit') loadPITData(1);
        else if (tableId === 'repair') loadRepairData(1);
    };

    window.selectRow = function (tableId, trElement, recordData) {
        const wasSelected = trElement.classList.contains('selected');

        // Deselect all rows in the table body
        document.querySelectorAll(`#${tableId}-tbody tr`).forEach(r => r.classList.remove('selected'));

        const editBtn = document.getElementById(`${tableId}-btn-edit`);
        const delBtn = document.getElementById(`${tableId}-btn-delete`);
        const detailsBtn = document.getElementById(`${tableId}-btn-details`);
        const printBtn = document.getElementById(`${tableId}-btn-print`);
        const exportCsvBtn = document.getElementById(`${tableId}-btn-export-csv`);

        if (wasSelected) {
            tableSelection[tableId] = null;
            if (editBtn) editBtn.disabled = true;
            if (delBtn) delBtn.disabled = true;
            if (detailsBtn) detailsBtn.disabled = true;
            if (printBtn) printBtn.disabled = true;
            if (exportCsvBtn) exportCsvBtn.disabled = true;
        } else {
            trElement.classList.add('selected');
            tableSelection[tableId] = recordData;
            if (editBtn) editBtn.disabled = false;
            if (delBtn) delBtn.disabled = false;
            if (detailsBtn) detailsBtn.disabled = false;
            if (printBtn) printBtn.disabled = false;
            if (exportCsvBtn) exportCsvBtn.disabled = false;

    // â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•

    window.getPerPage = function (containerId) {
        let sel = document.getElementById(containerId + '-perpage');
        if (!sel) {
            sel = document.querySelector(`#${containerId} .pg-select`);
        }
        return sel ? parseInt(sel.value, 10) : 50;
    };


    window.clientSideData = window.clientSideData || {};

    function paginateClientSide(entityKey, dataArray, page, perPage, containerId, tbodyId, renderRowFn, emptyStateHtml) {
        const total = dataArray.length;
        const tbody = document.getElementById(tbodyId);
        if (!tbody) return;

        tbody.innerHTML = '';
        if (total === 0) {
            tbody.innerHTML = emptyStateHtml;
            document.getElementById(containerId).innerHTML = '';
            return;
        }

        const start = (page - 1) * perPage;
        const end = Math.min(start + perPage, total);
        const slice = dataArray.slice(start, end);

        slice.forEach((item, index) => {
            const rowNum = start + index + 1;
            renderRowFn(item, rowNum, tbody);
        });

        window['render_' + entityKey] = function (p) {
            paginateClientSide(entityKey, dataArray, p, window.getPerPage ? getPerPage(containerId) : 50, containerId, tbodyId, renderRowFn, emptyStateHtml);
        };

        renderPagination(containerId, total, page, perPage, window['render_' + entityKey]);
    }

    window.getPerPage = function(containerId) {
        const container = document.getElementById(containerId);
        if (container) {
            const select = container.querySelector('.pg-select');
            if (select) return parseInt(select.value, 10);
        }
        return 50;
    };

    function renderPagination(containerId, total, currentPage, perPage, loadFn) {
        const container = document.getElementById(containerId);
        if (!container) return;
        const totalPages = Math.ceil(total / perPage);

        let html = '<div class="pg-controls-wrapper" style="display:flex; justify-content:space-between; align-items:center; width:100%; flex-wrap:wrap; gap:10px;">';

        // Left side: rows per page
        html += `<div class="pg-per-page" style="display:flex; align-items:center; gap:8px;">
            <span style="font-size:12px; color:#64748b;">Rows per page:</span>
            <select class="pg-select" style="padding:4px 8px; border:1px solid #e2e8f0; border-radius:6px; background:#fff; cursor:pointer; font-size:13px; color:#334155;">
                <option value="10" ${perPage == 10 ? 'selected' : ''}>10</option>
                <option value="25" ${perPage == 25 ? 'selected' : ''}>25</option>
                <option value="50" ${perPage == 50 ? 'selected' : ''}>50</option>
                <option value="100" ${perPage == 100 ? 'selected' : ''}>100</option>
            </select>
        </div>`;

        // Middle: pagination buttons
        let btnHtml = '<div class="pg-buttons" style="display:flex; gap:4px; align-items:center;">';
        const btnStyle = "padding:4px 10px; border:1px solid #e2e8f0; border-radius:6px; background:#fff; cursor:pointer; font-size:13px; color:#334155; transition:all 0.2s;";
        const activeStyle = "background:#0f172a; color:#fff; border-color:#0f172a;";
        const disabledStyle = "opacity: 0.5; cursor: not-allowed; pointer-events: none;";

        // First / Prev
        if (currentPage > 1) {
            btnHtml += `<button class="pg-btn" data-page="1" style="${btnStyle}">First</button>`;
            btnHtml += `<button class="pg-btn" data-page="${currentPage - 1}" style="${btnStyle}">&#8249; Prev</button>`;
        } else {
            btnHtml += `<button style="${btnStyle} ${disabledStyle}">First</button>`;
            btnHtml += `<button style="${btnStyle} ${disabledStyle}">&#8249; Prev</button>`;
        }

        let start = Math.max(1, currentPage - 2);
        let end = Math.min(Math.max(totalPages, 1), currentPage + 2);

        if (start > 1) btnHtml += `<span style="padding:4px 8px; color:#94a3b8;">...</span>`;

        for (let p = start; p <= end; p++) {
            btnHtml += `<button class="pg-btn" data-page="${p}" style="${btnStyle} ${p === currentPage ? activeStyle : ''}">${p}</button>`;
        }

        if (end < totalPages) btnHtml += `<span style="padding:4px 8px; color:#94a3b8;">...</span>`;

        // Next / Last
        if (currentPage < totalPages) {
            btnHtml += `<button class="pg-btn" data-page="${currentPage + 1}" style="${btnStyle}">Next &#8250;</button>`;
            btnHtml += `<button class="pg-btn" data-page="${totalPages}" style="${btnStyle}">Last</button>`;
        } else {
            btnHtml += `<button style="${btnStyle} ${disabledStyle}">Next &#8250;</button>`;
            btnHtml += `<button style="${btnStyle} ${disabledStyle}">Last</button>`;
        }
        btnHtml += '</div>';

        // Right side: info
        const infoHtml = `<div class="pg-info" style="font-size:12px; color:#64748b;">Showing ${total === 0 ? 0 : ((currentPage - 1) * perPage) + 1}&ndash;${Math.min(currentPage * perPage, total)} of ${total.toLocaleString()}</div>`;

        html += btnHtml + infoHtml + '</div>';
        container.innerHTML = html;

        // Attach event listeners dynamically to avoid loadFn.name bugs
        container.querySelectorAll('.pg-btn').forEach(btn => {
            btn.addEventListener('click', () => loadFn(parseInt(btn.getAttribute('data-page'), 10)));
        });

        const select = container.querySelector('.pg-select');
        if (select) {
            select.addEventListener('change', () => loadFn(1));
        }
    }
