<script>
    function openLogoutModal() { document.getElementById('modal-logout').classList.add('active'); }
    function closeLogoutModal() { document.getElementById('modal-logout').classList.remove('active'); }
    
    let confirmInterval = null;
    
    function showConfirmModal(message, onConfirm, countdownSeconds = 3) {
        document.getElementById('global-confirm-msg').innerText = message;
        const btn = document.getElementById('global-confirm-btn');
        const newBtn = btn.cloneNode(true);
        btn.parentNode.replaceChild(newBtn, btn);
        
        if (confirmInterval) clearInterval(confirmInterval);
        
        let timeLeft = countdownSeconds;
        newBtn.disabled = true;
        newBtn.innerText = `Confirm (${timeLeft})`;
        newBtn.style.cursor = 'not-allowed';
        newBtn.style.opacity = '0.7';
        
        confirmInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                newBtn.innerText = `Confirm (${timeLeft})`;
            } else {
                clearInterval(confirmInterval);
                newBtn.disabled = false;
                newBtn.innerText = 'Confirm';
                newBtn.style.cursor = 'pointer';
                newBtn.style.opacity = '1';
            }
        }, 1000);

        newBtn.addEventListener('click', () => {
            if (newBtn.disabled) return;
            closeConfirmModal();
            if(onConfirm) onConfirm();
        });
        document.getElementById('modal-global-confirm').classList.add('active');
    }

    function closeConfirmModal() { 
        if (confirmInterval) clearInterval(confirmInterval);
        document.getElementById('modal-global-confirm').classList.remove('active'); 
    }

    let selectedScheduleId = null;

    // ─── MODULE SORT ORDER ────────────────────────────────────────────────────────
    const MODULE_ORDER = ['CRS', 'GMS', 'SPAMS', 'CB', 'FPCP', 'RUNNING'];

    document.addEventListener('DOMContentLoaded', () => {

        // ─── SIDEBAR NAVIGATION ──────────────────────────────────────────────────
        const sidebarItems = document.querySelectorAll('.sidebar-item[data-panel]');
        const mainPanels   = document.querySelectorAll('.main-panel');

        sidebarItems.forEach(item => {
            item.addEventListener('click', () => {
                const targetPanel = item.getAttribute('data-panel');

                sidebarItems.forEach(i => i.classList.remove('active'));
                item.classList.add('active');

                mainPanels.forEach(p => p.classList.remove('active'));
                const panel = document.getElementById(`panel-${targetPanel}`);
                if (panel) panel.classList.add('active');

            });
        });

        // ─── INNER TAB SWITCHING (Administrator sub-tabs) ─────────────────────────
        const tabBtns   = document.querySelectorAll('.tab-btn[data-tab]');
        const tabPanels = document.querySelectorAll('.tab-panel');

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const targetTab = btn.getAttribute('data-tab');
                tabBtns.forEach(b => b.classList.remove('active'));
                tabPanels.forEach(p => p.classList.remove('active'));
                btn.classList.add('active');
                const targetPanel = document.getElementById(`panel-${targetTab}`);
                if (targetPanel) targetPanel.classList.add('active');

                // Lazy-load data when switching to these panels
                if (targetTab === 'scoreboard') fetchScoreboard();
            });
        });

        // Date display logic
        const dateDisplay = document.getElementById('sched-date-display');
        if (dateDisplay) {
            const today = new Date();
            const formattedDate = `${String(today.getMonth() + 1).padStart(2, '0')}/${String(today.getDate()).padStart(2, '0')}/${today.getFullYear()}`;
            dateDisplay.innerText = formattedDate;
            fetchSchedules(formattedDate);
        }

        // Update sequence preview if Line changes in Add mode
        const schedLineDrop = document.getElementById('sched-line');
        if (schedLineDrop) {
            schedLineDrop.addEventListener('change', (e) => {
                const title = document.getElementById('schedule-modal-title').innerText;
                if (title === 'Add Work Schedule') {
                    document.getElementById('sched-seq-preview').value = 'Calculating...';
                    const currentDate = document.getElementById('sched-date-display').innerText;
                    fetch(`/admin/api/next-sequence?line_id=${e.target.value}&date=${encodeURIComponent(currentDate)}`)
                        .then(res => res.json())
                        .then(data => {
                            document.getElementById('sched-seq-preview').value = data.next_sequence;
                        });
                }
            });
        }

        // Load Model Reference initial data
        if (typeof loadModels === 'function') loadModels();
        
        // Load active lines for dropdowns
        loadActiveLines();
        loadActiveModulesAndTags();

        // Model Reference: auto-load BOM on dropdown change
        const mrModelSelect = document.getElementById('mr-model-select');
        if (mrModelSelect) mrModelSelect.addEventListener('change', () => loadBOM());

        // Scoreboard filter wiring
        const sbDateFilter = document.getElementById('sb-date-filter');
        const sbLineFilter = document.getElementById('sb-line-filter');
        if (sbDateFilter) sbDateFilter.addEventListener('change', fetchScoreboard);
        if (sbLineFilter) sbLineFilter.addEventListener('change', fetchScoreboard);

        // Work Schedule filter wiring
        const schedLineFilter = document.getElementById('sched-line-filter');
        if (schedLineFilter) {
            schedLineFilter.addEventListener('change', () => {
                const dateDisplay = document.getElementById('sched-date-display');
                if (dateDisplay) fetchSchedules(dateDisplay.innerText);
            });
        }
    });

    let globalActiveLines = [];
    let lastIsMobile = null;

    function renderActiveLines() {
        const isMobile = window.innerWidth <= 768;
        if (lastIsMobile === isMobile) return; // Only re-render if crossing the breakpoint
        lastIsMobile = isMobile;

        const schedLine = document.getElementById('sched-line');
        const tsFilterLine = document.getElementById('ts-filter-line');
        const schedLineFilter = document.getElementById('sched-line-filter');
        const sbLineFilter = document.getElementById('sb-line-filter');
        const printQcLine = document.getElementById('print-qc-line');
        
        if (!globalActiveLines || globalActiveLines.length === 0) {
            const noLineHtml = '<option value="">-- No lines available --</option>';
            if (schedLine) schedLine.innerHTML = noLineHtml;
            if (tsFilterLine) tsFilterLine.innerHTML = noLineHtml;
            if (schedLineFilter) schedLineFilter.innerHTML = noLineHtml;
            if (sbLineFilter) sbLineFilter.innerHTML = noLineHtml;
            if (printQcLine) printQcLine.innerHTML = noLineHtml;
        } else {
            let html = '';
            globalActiveLines.forEach(l => {
                const displayText = isMobile ? l.lineno : l.name;
                html += `<option value="${l.lineno}">${displayText}</option>`;
            });
            
            const preserveVal = (el, newHtml, addAll) => {
                if (!el) return;
                const val = el.value;
                el.innerHTML = (addAll ? '<option value="all">All</option>' : '') + newHtml;
                if (val && el.querySelector(`option[value="${val}"]`)) {
                    el.value = val;
                }
            };

            preserveVal(schedLine, html, false);
            preserveVal(tsFilterLine, html, true);
            preserveVal(schedLineFilter, html, true);
            preserveVal(sbLineFilter, html, true);
            preserveVal(printQcLine, html, true);
        }
    }

    window.addEventListener('resize', () => {
        if (globalActiveLines.length > 0) renderActiveLines();
    });

    function loadActiveLines() {
        fetch('/api/lines/active')
            .then(res => res.json())
            .then(data => {
                globalActiveLines = data;
                lastIsMobile = null; // force render
                renderActiveLines();
            })
            .catch(err => console.error("Error fetching active lines:", err));
    }


    function fetchSchedules(date) {
        const lineFilter = document.getElementById('sched-line-filter');
        const lineId = lineFilter ? lineFilter.value : 'all';
        fetch(`/admin/api/schedules?date=${encodeURIComponent(date)}&line_id=${lineId}`)
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('sched-tbody');
                tbody.innerHTML = '';

                document.getElementById('sched-total-qty').innerText = data.total_qty || 0;

                let aveTakt = 0;
                if (data.schedules && data.schedules.length > 0) {
                    const totalTakt = data.schedules.reduce((sum, sched) => sum + sched.takt_time, 0);
                    aveTakt = parseFloat((totalTakt / data.schedules.length).toFixed(2));
                }
                const aveTaktElement = document.getElementById('sched-ave-takt');
                if (aveTaktElement) {
                    aveTaktElement.innerText = aveTakt;
                }

                if (data.schedules && data.schedules.length > 0) {
                    data.schedules.forEach(sched => {
                        const tr = document.createElement('tr');
                        tr.style.cursor = 'pointer';
                        tr.onclick = () => selectScheduleRow(tr, sched.id, sched);

                        // Bug Fix 1: orphaned model warning badge
                        const noBomBadge = sched.has_bom === false
                            ? `<span class="badge-no-bom" title="This model was deleted from Model Reference">⚠ No BOM</span>`
                            : '';

                        tr.innerHTML = `
                        <td>${sched.line_code}</td>
                        <td>${sched.sort_order}</td>
                        <td>${sched.model_number}${noBomBadge}</td>
                        <td>${sched.planned_qty}</td>
                        <td>${sched.actual_qty}</td>
                        <td>${sched.takt_time}</td>
                    `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="empty-state">
                            <div class="empty-state-wrapper">
                                <div class="empty-state-icon">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                        <line x1="16" y1="2" x2="16" y2="6"></line>
                                        <line x1="8" y1="2" x2="8" y2="6"></line>
                                        <line x1="3" y1="10" x2="21" y2="10"></line>
                                    </svg>
                                </div>
                                <h4 class="empty-state-title">No Schedules Found</h4>
                                <p class="empty-state-desc">No schedules exist for this date.</p>
                            </div>
                        </td>
                    </tr>
                `;
                }
                selectedScheduleId = null;
            })
            .catch(err => console.error("Error fetching schedules:", err));
    }

    let currentScheduleData = null;

    function selectScheduleRow(row, id, schedData) {
        const wasSelected = row.classList.contains('selected');
        document.querySelectorAll('#sched-tbody tr').forEach(tr => {
            tr.classList.remove('selected');
        });
        
        if (wasSelected) {
            selectedScheduleId = null;
            currentScheduleData = null;
        } else {
            row.classList.add('selected');
            selectedScheduleId = id;
            currentScheduleData = schedData;
        }
    }

    // ─── Populate sched-model dropdown from DB ────────────────────────────────────
    function loadScheduleModelDropdown(selectedValue, takenModels = new Set()) {
        return fetch('/admin/api/models')
            .then(res => res.json())
            .then(data => {
                const select = document.getElementById('sched-model');
                select.innerHTML = '<option value="">-- Select Model --</option>';
                data.forEach(model => {
                    const opt = document.createElement('option');
                    const isTaken = takenModels.has(model.model_number);
                    opt.value = model.model_number;
                    opt.textContent = isTaken
                        ? `${model.model_number}  (Already Scheduled)`
                        : model.model_number;
                    if (isTaken) {
                        opt.style.color = '#dc2626';
                        opt.style.fontWeight = '600';
                        opt.dataset.taken = '1';
                    }
                    select.appendChild(opt);
                });
                if (selectedValue) {
                    select.value = selectedValue;
                }
                // Apply red border warning whenever a taken model is selected
                _applySchedSelectWarning(select, takenModels);
            });
    }

    // Helper: red border + inline warning when a taken model is chosen
    function _applySchedSelectWarning(select, takenModels) {
        const update = () => {
            const warn = takenModels.has(select.value);
            select.style.borderColor = warn ? '#dc2626' : '';
            select.style.boxShadow = warn ? '0 0 0 3px rgba(220,38,38,.15)' : '';
            select.style.color = warn ? '#dc2626' : '';

            let lbl = document.getElementById('sched-model-warn');
            if (warn) {
                if (!lbl) {
                    lbl = document.createElement('div');
                    lbl.id = 'sched-model-warn';
                    lbl.style.cssText =
                        'font-size:12px;color:#dc2626;font-weight:600;margin-top:4px;'
                        + 'display:flex;align-items:center;gap:4px;';
                    lbl.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13"
                         viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                        <line x1="12" y1="9" x2="12" y2="13"/>
                        <line x1="12" y1="17" x2="12.01" y2="17"/>
                    </svg>
                    This model is already scheduled for today!`;
                    select.after(lbl);
                }
            } else if (lbl) {
                lbl.remove();
            }
        };
        // Swap the handler each call so there are no duplicate listeners
        select.removeEventListener('change', select._warnHandler);
        select._warnHandler = update;
        select.addEventListener('change', select._warnHandler);
        update(); // run once immediately
    }


    window.openScheduleModal = function (mode) {
        const modal = document.getElementById('modal-schedule');
        const title = document.getElementById('schedule-modal-title');
        const saveBtn = document.getElementById('sched-save-btn');

        // Set Date Preview
        const currentDate = document.getElementById('sched-date-display').innerText;
        document.getElementById('sched-date-preview').value = currentDate;

        if (mode === 'edit') {
            if (!selectedScheduleId) {
                alert("Please select a schedule to edit.");
                return;
            }
            title.innerText = 'Edit Work Schedule';
            saveBtn.innerText = 'Save Changes';

            document.getElementById('sched-id').value = currentScheduleData.id;
            document.getElementById('sched-seq-preview').value = currentScheduleData.sort_order;
            document.getElementById('sched-qty').value = currentScheduleData.planned_qty;
            document.getElementById('sched-takt').value = currentScheduleData.takt_time;

            // Populate dropdown then set the selected value
            loadScheduleModelDropdown(currentScheduleData.model_number).then(() => {
                document.getElementById('sched-line').value = currentScheduleData.line_id;
            });
        } else {
            title.innerText = 'Add Work Schedule';
            saveBtn.innerText = 'Add';

            document.getElementById('sched-id').value = '';
            document.getElementById('sched-seq-preview').value = 'Calculating...';

            // Fetch today's schedule to find already-used models, THEN load dropdown
            const currentDate = document.getElementById('sched-date-display').innerText;
            const lineId = document.getElementById('sched-line').value || 1;

            fetch(`/admin/api/schedules?date=${encodeURIComponent(currentDate)}&line_id=${lineId}`)
                .then(r => r.json())
                .then(sData => {
                    const taken = new Set((sData.schedules || []).map(s => s.model_number));
                    loadScheduleModelDropdown('', taken);
                })
                .catch(() => loadScheduleModelDropdown(''));

            // Fetch next sequence
            fetch(`/admin/api/next-sequence?line_id=${lineId}&date=${encodeURIComponent(currentDate)}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('sched-seq-preview').value = data.next_sequence;
                });

            document.getElementById('sched-qty').value = '';
            document.getElementById('sched-takt').value = '';
        }

        modal.classList.add('active');
    };

    window.closeScheduleModal = function () {
        document.getElementById('modal-schedule').classList.remove('active');
    };

    window.saveSchedule = function () {
        const id = document.getElementById('sched-id').value;
        const dateDisplay = document.getElementById('sched-date-display').innerText;

        const payload = {
            line_id: document.getElementById('sched-line').value,
            model_number: document.getElementById('sched-model').value,
            planned_qty: parseInt(document.getElementById('sched-qty').value),
            takt_time: parseFloat(document.getElementById('sched-takt').value),
            date: dateDisplay
        };

        if (!payload.model_number || payload.model_number.trim() === '') {
            showToast("Please select a Model.", 'error');
            return;
        }

        if (isNaN(payload.planned_qty) || payload.planned_qty <= 0) {
            showToast("Valid Planned Quantity is required.", 'error');
            return;
        }

        if (isNaN(payload.takt_time) || payload.takt_time <= 0) {
            showToast("Valid Takt Time is required.", 'error');
            return;
        }

        const url = id ? `/admin/api/schedule/${id}` : `/admin/api/schedule`;
        const method = id ? 'PUT' : 'POST';

        fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
            .then(res => res.json().then(data => ({ status: res.status, data })))
            .then(({ status, data }) => {
                if (data.success) {
                    closeScheduleModal();
                    fetchSchedules(dateDisplay);
                    showToast("Schedule saved successfully.", 'success');
                } else if (data.error === 'duplicate') {
                    // Show a prominent inline error — do NOT close the modal
                    showToast(data.message || "Duplicate model: please edit the existing entry.", 'error', 6000);
                } else {
                    showToast("Error saving schedule.", 'error');
                }
            })
            .catch(() => showToast("Network error. Please try again.", 'error'));
    };

    window.deleteSchedule = function () {
        if (!selectedScheduleId) {
            showToast("Please select a schedule to delete.", 'error');
            return;
        }

        showConfirmModal("Are you sure you want to delete this schedule?", () => {
            const dateDisplay = document.getElementById('sched-date-display').innerText;
            fetch(`/admin/api/schedule/${selectedScheduleId}`, {
                method: 'DELETE'
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        fetchSchedules(dateDisplay);
                        showToast("Schedule deleted.", 'success');
                    }
                });
        });
    };

    // \u2500\u2500\u2500 MODULE WORK SCHEDULE MODAL \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
    let _msAllRows = [];   // full row data for filter
    let _msSelected = null; // currently selected row data

    window.openModuleScheduleModal = function () {
        const date = document.getElementById('sched-date-display').innerText;
        const lineId = document.getElementById('sched-line-filter').value || 1;
        const lineno = lineId === 'all' ? 'All Lines' : lineId;

        document.getElementById('ms-date-display').textContent = date;
        document.getElementById('ms-line-display').textContent = lineno;
        document.getElementById('ms-module-filter').value = 'All';
        document.getElementById('ms-tbody').innerHTML =
            `<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--text-secondary);">Loading\u2026</td></tr>`;
        document.getElementById('modal-module-sched').classList.add('active');

        // Fetch schedules + BOM module data in parallel
        Promise.all([
            fetch(`/admin/api/schedules?date=${encodeURIComponent(date)}&line_id=${lineId}`).then(r => r.json()),
            fetch('/admin/api/models').then(r => r.json())
        ]).then(([schedData, models]) => {
            const scheds = schedData.schedules || [];

            if (scheds.length === 0) {
                _msAllRows = [];
                document.getElementById('ms-tbody').innerHTML =
                    `<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--text-secondary);">No schedules for this date / line.</td></tr>`;
                return;
            }

            // Fetch BOM for each unique model to get module info
            const uniqueModels = [...new Set(scheds.map(s => s.model_number))];
            const bomPromises = uniqueModels.map(m =>
                fetch(`/admin/api/bom?modelcode=${encodeURIComponent(m)}`).then(r => r.json()).then(d => ({
                    model: m,
                    modules: [...new Set((d.parts || []).map(p => p.module_code).filter(Boolean))]
                }))
            );

            Promise.all(bomPromises).then(bomResults => {
                const moduleMap = {};
                bomResults.forEach(b => { moduleMap[b.model] = b.modules; });

                _msAllRows = scheds.map(s => ({
                    id: s.id,
                    seq: s.sort_order,
                    model: s.model_number,
                    plan: s.planned_qty,
                    act: s.actual_qty,
                    modules: moduleMap[s.model_number] || []
                }));

                _msSelected = null;
                renderModuleSchedTable(_msAllRows);
            });
        }).catch(() => {
            document.getElementById('ms-tbody').innerHTML =
                `<tr><td colspan="5" style="text-align:center;padding:24px;color:#ef4444;">Failed to load data.</td></tr>`;
        });
    };

    window.closeModuleSchedModal = function () {
        document.getElementById('modal-module-sched').classList.remove('active');
        _msSelected = null;
    };

    window.filterModuleSchedTable = function () {
        const filter = document.getElementById('ms-module-filter').value;
        if (filter === 'All') {
            renderModuleSchedTable(_msAllRows);
        } else {
            renderModuleSchedTable(_msAllRows.filter(r => r.modules.includes(filter)));
        }
    };

    function renderModuleSchedTable(rows) {
        const tbody = document.getElementById('ms-tbody');
        if (!rows || rows.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--text-secondary);">No entries match the selected module.</td></tr>`;
            return;
        }

        const MODULE_COLORS = {
            'CRS': { bg: '#eff6ff', color: '#1d4ed8', border: '#bfdbfe' },
            'GMS': { bg: '#f0fdf4', color: '#15803d', border: '#bbf7d0' },
            'SPAMS': { bg: '#fefce8', color: '#a16207', border: '#fef08a' },
            'FPCP': { bg: '#fff7ed', color: '#c2410c', border: '#fed7aa' },
            'CB': { bg: '#fdf4ff', color: '#7e22ce', border: '#e9d5ff' },
            'RUNNING': { bg: '#f0f9ff', color: '#0369a1', border: '#bae6fd' },
        };

        tbody.innerHTML = '';
        rows.forEach((row, idx) => {
            const tr = document.createElement('tr');
            tr.style.cssText = `cursor:pointer; border-bottom: 1px solid var(--border-light);
            background: ${idx % 2 === 0 ? 'white' : 'var(--bg-main)'};
            transition: background 0.15s;`;

            tr.onmouseenter = () => { if (_msSelected !== row) tr.style.background = '#f1f5f9'; };
            tr.onmouseleave = () => { if (_msSelected !== row) tr.style.background = idx % 2 === 0 ? 'white' : 'var(--bg-main)'; };
            tr.onclick = () => {
                const wasSelected = tr.classList.contains('selected');
                tbody.querySelectorAll('tr').forEach(t => t.classList.remove('selected'));
                
                if (wasSelected) {
                    _msSelected = null;
                } else {
                    tr.classList.add('selected');
                    _msSelected = row;
                }
            };

            // Badge pills for modules
            const badges = row.modules.length > 0
                ? row.modules.map(m => {
                    const c = MODULE_COLORS[m] || { bg: '#f1f5f9', color: '#475569', border: '#e2e8f0' };
                    return `<span style="display:inline-block; padding: 2px 8px; border-radius: 999px;
                    font-size: 11px; font-weight: 700; letter-spacing:.04em;
                    background:${c.bg}; color:${c.color}; border:1px solid ${c.border};">${m}</span>`;
                }).join(' ')
                : `<span style="color:var(--text-secondary);font-size:12px;">—</span>`;

            tr.innerHTML = `
            <td style="padding:10px 12px; font-weight:600; color:var(--text-secondary); vertical-align:middle;">${row.seq}</td>
            <td style="padding:10px 12px; font-weight:600; vertical-align:middle;">${row.model}</td>
            <td style="padding:10px 12px; text-align:center; vertical-align:middle;">${row.plan}</td>
            <td style="padding:10px 12px; text-align:center; font-weight:600; vertical-align:middle;
                color:${row.act >= row.plan && row.plan > 0 ? '#15803d' : 'inherit'};">${row.act}</td>
            <td style="padding:10px 12px; text-align:center; vertical-align:middle;">
                <div style="display:flex; flex-direction:column; gap:4px; align-items:center;">
                    ${badges}
                </div>
            </td>
        `;
            tbody.appendChild(tr);
        });
    }

    window.openModuleSchedEdit = function () {
        if (!_msSelected) { showToast('Please select a row first.', 'error'); return; }
        closeModuleSchedModal();
        // Re-use the existing Edit schedule modal with the selected row data
        const fake = {
            id: _msSelected.id,
            sort_order: _msSelected.seq,
            model_number: _msSelected.model,
            planned_qty: _msSelected.plan,
            takt_time: null,
            line_id: document.getElementById('sched-line-filter').value || 1
        };
        currentScheduleData = fake;
        selectedScheduleId = fake.id;
        openScheduleModal('edit');

    window.fetchScoreboard = function (page = 1) {

            .then(res => res.json())
            .then(data => {
                tbody.innerHTML = '';

                    if (data.total_pages > 1) {

                        document.getElementById('sb-next-btn').disabled = data.current_page >= data.total_pages;

                        tr.style.cursor = 'pointer';
                        tr.onclick = () => selectScoreboardRow(tr, row.id, row);

                        <td>${row.model_number} (Seq ${row.seq})</td>

                        <td>${row.plan}</td>

    window.loadBOM = function () {
        const modelcode = document.getElementById('mr-model-select').value;
        const tbody = document.getElementById('mr-tbody');

        if (!modelcode) {
            tbody.innerHTML = `
            <tr>
                <td colspan="5" class="empty-state">
                    <div class="empty-state-wrapper">
                        <h4 class="empty-state-title">No Model Selected</h4>
                        <p class="empty-state-desc">Select a model from the dropdown above to view its Bill of Materials (BOM) details.</p>
                    </div>
                </td>
            </tr>
        `;
            document.getElementById('bom-action-btns').style.display = 'none';
            return;
        }

        // ── Bug Fix 2: Show skeleton loader while fetching ────────────────────────
        tbody.innerHTML = [1,2,3,4].map(() => `
            <tr>
                <td><div class="skeleton-cell" style="width:55px;height:13px;"></div></td>
                <td><div class="skeleton-cell" style="width:110px;height:13px;"></div></td>
                <td><div class="skeleton-cell" style="width:200px;height:13px;"></div></td>
                <td><div class="skeleton-cell" style="width:35px;height:13px;"></div></td>
                <td><div class="skeleton-cell" style="width:85px;height:13px;"></div></td>
            </tr>`).join('');
        document.getElementById('bom-action-btns').style.display = 'none';
        // ──────────────────────────────────────────────────────────────────────────

        fetch(`/admin/api/bom?modelcode=${encodeURIComponent(modelcode)}`)
            .then(res => res.json())
            .then(data => {
                const moduleFilter = document.getElementById('mr-module-filter').value;
                let partsToRender = data.parts || [];
                if (moduleFilter !== 'All') {
                    partsToRender = partsToRender.filter(p => p.module_code === moduleFilter);
                }

                if (partsToRender.length > 0) {
                    tbody.innerHTML = '';

                    // Sort by fixed module order
                    const sorted = [...partsToRender].sort((a, b) => {
                        const ai = MODULE_ORDER.indexOf(a.module_code);
                        const bi = MODULE_ORDER.indexOf(b.module_code);
                        const aRank = ai === -1 ? MODULE_ORDER.length : ai;
                        const bRank = bi === -1 ? MODULE_ORDER.length : bi;
                        return aRank - bRank;
                    });


                    let lastModule = null;
                    let rowIndex = 0;
                    sorted.forEach(part => {
                        if (part.module_code !== lastModule) {
                            const groupRow = document.createElement('tr');
                            groupRow.style.pointerEvents = 'none';
                            groupRow.innerHTML = `
                            <td colspan="5" style="
                                background: var(--bg-main);
                                padding: 0.35rem 1rem;
                                font-size: 0.7rem;
                                font-weight: 700;
                                letter-spacing: 0.08em;
                                text-transform: uppercase;
                                color: var(--text-secondary);
                                border-bottom: 1px solid var(--border-light);
                            ">— ${part.module_code} —</td>
                        `;
                            tbody.appendChild(groupRow);
                            lastModule = part.module_code;
                        }

                        const tr = document.createElement('tr');
                        // Bug Fix 2: entrance animation with staggered delay
                        tr.className = 'bom-row';
                        tr.style.animationDelay = `${rowIndex * 30}ms`;
                        tr.style.cursor = 'pointer';
                        tr.onclick = function () { selectBomRow(this, part.id, part); };
                        tr.innerHTML = `
                        <td>${part.module_code}</td>
                        <td>${part.part_number}</td>
                        <td>${part.description}</td>
                        <td>${part.usage_qty}</td>
                        <td>${part.tag}</td>
                    `;
                        tbody.appendChild(tr);
                        rowIndex++;
                    });

                    document.getElementById('bom-action-btns').style.display = 'flex';
                    selectedBomId = null;
                    currentBomData = null;
                } else {
                    tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="empty-state" style="text-align: center; padding: 2rem;">
                            No parts found for this model.
                        </td>
                    </tr>
                `;
                    document.getElementById('bom-action-btns').style.display = 'flex';
                }
            })
            .catch(() => {
                tbody.innerHTML = `<tr><td colspan="5" class="empty-state">Failed to load BOM data.</td></tr>`;
            });
    };

    window.toggleOtherInput = function(selectId, inputId) {
        const select = typeof selectId === 'string' ? document.getElementById(selectId) : selectId;
        const input = typeof inputId === 'string' ? document.getElementById(inputId) : inputId;
        if (!select || !input) return;
        if (select.value === 'Other') {
            input.style.display = '';
            input.focus();
        } else {
            input.style.display = 'none';
        }
    };

    window.validateNewModelCode = function() {
        const input = document.getElementById('bom-model');
        const errorDiv = document.getElementById('bom-model-error');
        const val = input.value.trim().toLowerCase();
        const isNewModelMode = document.getElementById('bom-model-input-group').style.display !== 'none';
        
        if (!isNewModelMode) return true;
        
        const exists = Array.from(document.getElementById('mr-model-select').options)
            .some(opt => opt.value.toLowerCase() === val && opt.value !== '');
            
        if (exists) {
            input.style.borderColor = '#dc2626';
            input.style.backgroundColor = '#fef2f2';
            if (errorDiv) errorDiv.style.display = 'block';
            return false;
        } else {
            input.style.borderColor = '';
            input.style.backgroundColor = '';
            if (errorDiv) errorDiv.style.display = 'none';
            return true;
        }
    };

    window.saveBom = function () {
        if (!window.validateNewModelCode()) {
            showToast("Model already exists. Please select it from the dropdown.", 'error');
            return;
        }
        const id = document.getElementById('bom-id').value;
        const modelcode = document.getElementById('bom-model').value;
        
        const container = document.getElementById('bom-parts-container');
        const rows = container.querySelectorAll('.bom-part-row');
        if (rows.length === 0) {
            showToast("Please add at least one part.", "error");
            return;
        }

        const payloads = [];
        let hasError = false;

        rows.forEach(row => {
            row.style.borderColor = 'var(--border-light)';
            
            let selectedModule = row.querySelector('.part-module').value;
            if (selectedModule === 'Other') selectedModule = row.querySelector('.part-module-other').value.trim();

            let selectedTag = row.querySelector('.part-tag').value;
            if (selectedTag === 'Other') selectedTag = row.querySelector('.part-tag-other').value.trim();

            const partno = row.querySelector('.part-no').value.trim();
            const desc = row.querySelector('.part-desc').value.trim();
            const usage = parseFloat(row.querySelector('.part-usage').value) || 1;

            if (!modelcode || !partno || !selectedModule) {
                row.style.borderColor = '#dc2626';
                hasError = true;
                return;
            }

            payloads.push({
                rowElement: row,
                data: {
                    modelcode: modelcode,
                    module: selectedModule,
                    partno: partno,
                    partdesc: desc,
                    usage: usage,
                    tag: selectedTag
                }
            });
        });

        if (hasError) {
            showToast("Please fill all required fields (Part Number, Module) in all rows.", "error");
            return;
        }

        const url = id ? `/admin/api/bom/${id}` : `/admin/api/bom`;
        const method = id ? 'PUT' : 'POST';

        document.getElementById('bom-save-btn').disabled = true;

        Promise.all(payloads.map(p => {
            return fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(p.data)
            }).then(res => res.json()).then(data => ({ success: data.success, data: data, row: p.rowElement }));
        })).then(results => {
            let allSuccess = true;
            let errMsgs = [];
            
            results.forEach(res => {
                if (res.success) {
                    res.row.remove(); // Remove successful rows
                } else {
                    allSuccess = false;
                    res.row.style.borderColor = '#dc2626'; // Highlight failed row
                    errMsgs.push(res.data.message || "Error saving part.");
                }
            });

            document.getElementById('bom-save-btn').disabled = false;
            loadModels();

            if (allSuccess) {
                showToast("All parts saved successfully.", 'success');
                closeBomModal();
                setTimeout(() => {
                    document.getElementById('mr-model-select').value = modelcode;
                    loadBOM();
                }, 300);
            } else {
                showToast(`Some parts failed to save:\\n${errMsgs.join('\\n')}`, 'error', 5000);
            }
        });
    };

    function loadActiveModulesAndTags() {

        fetch('/api/modules/active')

                function updateFilter(filterEl) {

                    const currentVal = filterEl.value;
                    const allOpt = Array.from(filterEl.options).find(o => o.value === 'All') || new Option('All Modules', 'All');
                    filterEl.innerHTML = '';
                    filterEl.appendChild(allOpt);
                    data.forEach(m => {
                        const opt = document.createElement('option');
                        opt.value = m.name; opt.textContent = m.name;
                        filterEl.appendChild(opt);
                    });
                    if (Array.from(filterEl.options).some(o => o.value === currentVal)) {
                        filterEl.value = currentVal;
                    }
                }

                updateFilter(msModuleFilter);
                updateFilter(mrModuleFilter);
            })
            .catch(err => console.error('Error loading modules:', err));

        // Load Tags
        fetch('/api/tags/active')
            .then(res => res.json())
            .then(data => {
                window.activeTags = data;
            })

    window.handleSort = function(tableId, column) {
        const state = tableSorts[tableId];
        if (state.by === column) {
            state.dir = state.dir === 'asc' ? 'desc' : 'asc';
        } else {
            state.by = column;
            state.dir = 'desc'; // Default to desc when changing column
        }
        
        // Update sort indicators
        document.querySelectorAll(`#${tableId}-table .sort-indicator`).forEach(el => el.innerHTML = '');
        const indicator = document.getElementById(`${tableId}-sort-${column}`);
        if (indicator) {
            indicator.innerHTML = state.dir === 'asc' 
                ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"></polyline></svg>'
                : '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>';
        }

        // Trigger data load based on table
        if (tableId === 'crs') loadCRSData(1);
        else if (tableId === 'gms') loadGMSData(1);
        else if (tableId === 'att') loadATTData(1);
        else if (tableId === 'spams') loadSPAMSData(1);
        else if (tableId === 'cbpcb') loadCBPCBData(1);
        else if (tableId === 'insp2') loadINSP2Data(1);

    window.selectRow = function(tableId, trElement, recordData) {
        const wasSelected = trElement.classList.contains('selected');
        
        // Deselect all rows in the table body
        document.querySelectorAll(`#${tableId}-tbody tr`).forEach(r => r.classList.remove('selected'));
        
        const editBtn = document.getElementById(`${tableId}-btn-edit`);
        const delBtn = document.getElementById(`${tableId}-btn-delete`);

        if (wasSelected) {
            tableSelection[tableId] = null;
            if (editBtn) editBtn.disabled = true;
            if (delBtn) delBtn.disabled = true;
        } else {
            trElement.classList.add('selected');
            tableSelection[tableId] = recordData;
            if (editBtn) editBtn.disabled = false;
            if (delBtn) delBtn.disabled = false;
        }
    };

    //  SHARED PAGINATION RENDERER
    // ═══════════════════════════════════════════════════════════════════════════
    function renderPagination(containerId, total, currentPage, perPage, loadFn) {
        const container = document.getElementById(containerId);
        if (!container) return;
        const totalPages = Math.ceil(total / perPage);
        if (totalPages <= 1) { container.innerHTML = ''; return; }

        let html = '';
        if (currentPage > 1)
            html += `<button onclick="${loadFn.name}(${currentPage - 1})">&#8249; Prev</button>`;

        const start = Math.max(1, currentPage - 2);
        const end   = Math.min(totalPages, currentPage + 2);
        for (let p = start; p <= end; p++) {
            html += `<button class="${p === currentPage ? 'active' : ''}" onclick="${loadFn.name}(${p})">${p}</button>`;
        }
        if (currentPage < totalPages)
            html += `<button onclick="${loadFn.name}(${currentPage + 1})">Next &#8250;</button>`;

        html += `<span class="pg-info">Showing ${((currentPage-1)*perPage)+1}–${Math.min(currentPage*perPage, total)} of ${total.toLocaleString()}</span>`;
        container.innerHTML = html;
    }

// LINES
// ═══════════════════════════════════════════════════════════════════════════════
let selectedLineId = null;
let currentLineData = null;

function loadLines() {
    fetch('/sys/api/lines')
        .then(r => r.json())
        .then(data => {
            const tbody = document.getElementById('lines-tbody');
            if(!tbody) return;
            tbody.innerHTML = '';
            if (!data.length) {
                tbody.innerHTML = '<tr class="empty-state-row"><td colspan="4" class="empty-state"><div class="empty-state-wrapper"><h4 class="empty-state-title">No lines found</h4><p class="empty-state-desc">Click "Add Line" to create one.</p></div></td></tr>';
                updateLineButtons();
                return;
            }
            data.forEach(l => {
                const tr = document.createElement('tr');
                tr.onclick = () => selectLineRow(tr, l);
                tr.innerHTML = `
                    <td><strong>${l.lineno}</strong></td>
                    <td>${l.name}</td>
                    <td><span class="badge ${l.is_active ? 'badge-active' : 'badge-inactive'}">${l.is_active ? 'Active' : 'Inactive'}</span></td>
                    <td style="color:var(--text-secondary);">${l.created_at.split(' ')[0]}</td>
                `;
                tbody.appendChild(tr);
            });
            updateLineButtons();
        });
}

function filterLines() {
    const term = document.getElementById('lines-search').value.toLowerCase();
    const rows = document.querySelectorAll('#lines-tbody tr:not(.empty-state-row)');
    rows.forEach(r => {
        const text = r.textContent.toLowerCase();
        r.style.display = text.includes(term) ? '' : 'none';
    });
}

function updateLineButtons() {
    const hasSelection = !!selectedLineId;
    const editBtn = document.getElementById('line-edit-btn');
    const delBtn = document.getElementById('line-delete-btn');
    if(editBtn) editBtn.disabled = !hasSelection;
    if(delBtn) delBtn.disabled = !hasSelection;
}

function selectLineRow(tr, lineData) {
    const wasSelected = tr.classList.contains('selected');
    document.querySelectorAll('#lines-tbody tr').forEach(r => r.classList.remove('selected'));
    
    if (wasSelected) {
        selectedLineId = null;
        currentLineData = null;
    } else {
        tr.classList.add('selected');
        selectedLineId = lineData.id;
        currentLineData = lineData;
    }
    updateLineButtons();
}

function openLineModal(mode) {
    const modal = document.getElementById('modal-line');
    const title = document.getElementById('line-modal-title');
    const statusGroup = document.getElementById('line-status-group');

    if (mode === 'edit') {
        if (!selectedLineId) { showToast('Please select a line to edit.', 'error'); return; }
        title.textContent = 'Edit Line';
        document.getElementById('line-id').value = currentLineData.id;
        document.getElementById('line-lineno').value = currentLineData.lineno;
        document.getElementById('line-name').value = currentLineData.name;
        document.getElementById('line-active').value = currentLineData.is_active ? 'true' : 'false';
        statusGroup.style.display = 'block';
    } else {
        title.textContent = 'Add Line';
        document.getElementById('line-id').value = '';
        document.getElementById('line-lineno').value = '';
        document.getElementById('line-name').value = '';
        statusGroup.style.display = 'none';
    }
    modal.classList.add('active');
}

function closeLineModal() { document.getElementById('modal-line').classList.remove('active'); }

function saveLine() {
    const id = document.getElementById('line-id').value;
    const lineno = document.getElementById('line-lineno').value.trim();
    const name = document.getElementById('line-name').value.trim();
    if (!lineno) { showToast('Line number is required.', 'error'); return; }
    if (!name) { showToast('Display name is required.', 'error'); return; }

    const payload = { lineno, name };
    if (id) {
        payload.id = id;
        payload.is_active = document.getElementById('line-active').value === 'true';
    }

    const url = id ? `/sys/api/line/${id}` : '/sys/api/line';
    const method = id ? 'PUT' : 'POST';

    fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
        .then(r => r.json())
        .then(d => {
            if (d.success) { 
                closeLineModal(); 
                loadLines(); 
                loadActiveLines(); // Update dropdowns
                showToast('Line saved.', 'success'); 
            }
            else showToast(d.error || 'Error saving line.', 'error', 5000);
        });
}

function deleteLine() {
    if (!selectedLineId) { showToast('Please select a line to delete.', 'error'); return; }
    showConfirmModal(`Delete line ${currentLineData.lineno}?`, () => {
        fetch(`/sys/api/line/${selectedLineId}`, { method: 'DELETE' })
            .then(r => r.json())
            .then(d => {
                if (d.success) { 
                    selectedLineId = null; 
                    currentLineData = null; 
                    loadLines(); 
                    loadActiveLines(); // Update dropdowns
                    showToast('Line deleted.', 'success'); 
                }
                else showToast(d.error || 'Error.', 'error', 5000);
            });
    });
}

    window.loadSerialStart = function () {
        const tbody = document.getElementById('ss-tbody');
        if (!tbody) return;

        const area = (document.getElementById('ss-area-filter')?.value || '').trim();
        const url = area ? `/admin/api/modelref?area=${encodeURIComponent(area)}` : '/admin/api/modelref';

        tbody.innerHTML = `<tr><td colspan="4" class="empty-state" style="padding:1.5rem; text-align:center;">Loading…</td></tr>`;

        fetch(url)
            .then(r => r.json())
            .then(data => {
                const entries = data.entries || [];
                if (entries.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="empty-state" style="padding:1.5rem; text-align:center;">No serial start entries found.</td></tr>`;
                    return;
                }
                tbody.innerHTML = '';
                _ssSelectedId = null;
                _ssSelectedData = null;
                entries.forEach((e, idx) => {
                    const tr = document.createElement('tr');
                    tr.style.cssText = `cursor:pointer; border-bottom: 1px solid var(--border-light);
                    background: ${idx % 2 === 0 ? 'white' : 'var(--bg-main)'};
                    transition: background 0.15s;`;

                    tr.onmouseenter = () => { if (_ssSelectedId !== e.id) tr.style.background = '#f1f5f9'; };
                    tr.onmouseleave = () => { if (_ssSelectedId !== e.id) tr.style.background = idx % 2 === 0 ? 'white' : 'var(--bg-main)'; };
                    
                    tr.onclick = () => {
                        const wasSelected = tr.classList.contains('selected');
                        tbody.querySelectorAll('tr').forEach(t => {
                            t.classList.remove('selected');
                            t.style.background = (Array.from(tbody.children).indexOf(t) % 2 === 0) ? 'white' : 'var(--bg-main)';
                        });
                        
                        if (wasSelected) {
                            _ssSelectedId = null;
                            _ssSelectedData = null;
                        } else {
                            tr.classList.add('selected');
                            tr.style.background = '#e2e8f0'; // Selected color
                            _ssSelectedId = e.id;
                            _ssSelectedData = e;
                        }
                    };

                    tr.innerHTML = `
                        <td style="padding:10px 12px; vertical-align:middle;"><strong>${e.modelcode || '—'}</strong></td>
                        <td style="padding:10px 12px; vertical-align:middle;"><span style="
                            display:inline-block; padding:2px 10px; border-radius:12px; font-size:11px; font-weight:600;
                            background:var(--accent-primary,#3b82f6)22; color:var(--accent-primary,#3b82f6);
                            border:1px solid var(--accent-primary,#3b82f6)44;
                        ">${e.area || '—'}</span></td>
                        <td style="padding:10px 12px; vertical-align:middle;"><code style="font-size:13px; font-weight:700; letter-spacing:1px;">${e.serialstart || '—'}</code></td>
                    `;
                    tbody.appendChild(tr);
                });

            .catch(() => {

            select.innerHTML = '<option value="">Loading models...</option>';
        }
        
        document.getElementById('modal-specific-qc').classList.add('active');
        
        // Fetch models to populate dropdown
        fetch('/admin/api/models')
            .then(r => r.json())
            .then(models => {
                if (select.tomselect) {
                    select.tomselect.clearOptions();
                    select.tomselect.addOption({value: "", text: "-- Select Model --"});
                    models.forEach(m => {
                        const val = m.model_number || m;
                        select.tomselect.addOption({value: val, text: val});
                    });
                    select.tomselect.refreshOptions(false);
                } else {
                    select.innerHTML = '<option value="">-- Select Model --</option>';
                    models.forEach(m => {
                        const option = document.createElement('option');
                        const val = m.model_number || m;
                        option.value = val;
                        option.textContent = val;
                        select.appendChild(option);
                    });
                }
            })
            .catch(err => {
                console.error("Failed to fetch models:", err);
                if (select.tomselect) {
                    select.tomselect.clearOptions();
                    select.tomselect.addOption({value: "", text: "Error loading models"});
                    select.tomselect.refreshOptions(false);
                } else {
                    select.innerHTML = '<option value="">Error loading models</option>';
                }
            });
    };

    window.closeQCReportModal = function() {
        document.getElementById('modal-specific-qc').classList.remove('active');
    };

    window.submitSpecificQCReport = function() {
        const model = document.getElementById('qc-specific-model').value;
        const serial = document.getElementById('qc-specific-serial').value.trim();
        const errDiv = document.getElementById('qc-specific-error');
        
        if (!model) {
            errDiv.textContent = 'Please select a model.';
            errDiv.style.display = 'block';
            return;
        }
        if (!serial) {
            errDiv.textContent = 'Please enter a serial number.';
            errDiv.style.display = 'block';
            return;
        }
        
        // Open print view in new tab
        const url = `/admin/print-specific-qc?model=${encodeURIComponent(model)}&serial=${encodeURIComponent(serial)}`;
        window.open(url, '_blank');
        closeQCReportModal();
    };

</script>
