    window.openEditModal = function (type, record) {
        document.getElementById('edit-record-type').value = type;
        document.getElementById('edit-record-id').value = record.id;
        document.getElementById('edit-record-model').value = record.modelcode || '';
        document.getElementById('edit-record-serial').value = record.serial || '';

        const container = document.getElementById('dynamic-edit-fields');
        container.innerHTML = '';

        // Exclude system fields, read-only indicators, computed statuses, and large texts
        const excludeFields = ['id', 'time', 'modelcode', 'serial', 'ng_history', 'status', 'tag_status', 'actions', 'remarks'];

        for (const [key, value] of Object.entries(record)) {
            if (excludeFields.includes(key)) continue;

            const div = document.createElement('div');
            div.className = 'form-group';

            const label = document.createElement('label');
            // Capitalize and replace underscores
            label.textContent = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase()) + ':';

            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'dynamic-edit-input';
            input.dataset.key = key;
            input.value = value !== null ? value : '';
            input.placeholder = `Enter ${label.textContent.replace(':', '')}`;

            div.appendChild(label);
            div.appendChild(input);
            container.appendChild(div);
        }

        document.getElementById('modal-edit-record').classList.add('active');
    };

    window.closeEditRecordModal = function () {
        document.getElementById('modal-edit-record').classList.remove('active');
    };

    window.saveEditRecord = function () {
        const type = document.getElementById('edit-record-type').value;
        const id = document.getElementById('edit-record-id').value;

        let payload = {};
        const inputs = document.querySelectorAll('#dynamic-edit-fields .dynamic-edit-input');
        inputs.forEach(input => {
            payload[input.dataset.key] = input.value.trim();
        });

        fetch(`/admin/api/${type}-data/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(r => r.json()).then(data => {
            if (data.success) {
                showToast(`${type.toUpperCase()} record updated.`, 'success');
                closeEditRecordModal();
                if (type === 'crs' && typeof loadCRSData === 'function') loadCRSData();
                else if (type === 'gms' && typeof loadGMSData === 'function') loadGMSData();
                else if (type === 'att' && typeof loadATTData === 'function') loadATTData();
                else if (type === 'spamsi' && typeof loadSPAMSIData === 'function') loadSPAMSIData();
                else if (type === 'spamso' && typeof loadSPAMSOData === 'function') loadSPAMSOData();
                else if (type === 'wci' && typeof loadWCIData === 'function') loadWCIData();
                else if (type === 'insp3run' && typeof loadRITData === 'function') loadRITData();
                else if (type === 'pit' && typeof loadPITData === 'function') loadPITData();
                else if (type === 'fit' && typeof loadFITData === 'function') loadFITData();
                else if (type === 'repair' && typeof loadRepairData === 'function') loadRepairData();
            } else {
                showToast(data.error || 'Failed to update record', 'error');
            }
        }).catch(err => {
            console.error('Update Error:', err);
            showToast('Network error occurred.', 'error');
        });
    };

    function formatAuditDetails(detailsStr) {
        if (!detailsStr) return '—';
        try {
            const parsed = JSON.parse(detailsStr);
            if (typeof parsed !== 'object' || parsed === null) return detailsStr;
            let html = '';
            for (const [key, value] of Object.entries(parsed)) {
                html += `<span class="audit-detail-pill"><strong>${key}:</strong> ${value}</span>`;
            }
            return html || '—';
        } catch (e) {
            return detailsStr;
        }
    }

    window.loadAuditLogs = function (page = 1) {
        const tbody = document.getElementById('audit-tbody');
        const totalEl = document.getElementById('audit-total');

        const loadingState = setupTableLoading(tbody, 7, 'loadAuditLogs', 'row');

        fetch(`/admin/api/audit-logs?page=${page}`)
            .then(r => r.json())
            .then(data => {
                finishTableLoading(loadingState);
                totalEl.textContent = data.total.toLocaleString();
                tbody.innerHTML = '';
                if (!data.records || data.records.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="empty-state">No audit logs found.</td></tr>`;
                    document.getElementById('audit-pagination').innerHTML = '';
                    return;
                }
                data.records.forEach((r, i) => {
                    const rowNum = (data.page - 1) * data.per_page + i + 1;
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${rowNum}</td><td>${r.timestamp}</td>
                        <td>${r.full_name}</td>
                        <td><span style="font-weight:600; color:var(--accent-primary)">${r.action}</span></td>
                        <td>${r.table_name.toUpperCase()}</td>
                        <td>${r.record_id}</td>
                        <td style="max-width:350px; white-space:normal; padding:8px;">${formatAuditDetails(r.details)}</td>
                    `;
                    tbody.appendChild(tr);
                });
                renderPagination('audit-pagination', data.total, data.page, data.per_page, loadAuditLogs);
            })
            .catch(() => {
                finishTableLoading(loadingState);
                showToast('Failed to load audit logs.', 'error');
            });
    };

    window.submitPasswordChange = function () {
        const newPwd = document.getElementById('profile-new-pwd').value;
        const confPwd = document.getElementById('profile-conf-pwd').value;

        if (!newPwd || newPwd.length < 4) {
            showToast('Password must be at least 4 characters.', 'error');
            return;
        }
        if (newPwd !== confPwd) {
            showToast('Passwords do not match.', 'error');
            return;
        }

        fetch('/auth/change-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ new_password: newPwd })
        })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    showToast(data.message, 'success');
                    closeProfileModal();
                } else {
                    showToast(data.message || 'Failed to change password', 'error');
                }
            })
            .catch(err => {
                console.error(err);
                showToast('An error occurred.', 'error');
            });
    };

    window.loadSerialStart = function () {
        const tbody = document.getElementById('ss-tbody');
        if (!tbody) return;

        const area = (document.getElementById('ss-area-filter')?.value || '').trim();
        const url = area ? `/admin/api/serialref?area=${encodeURIComponent(area)}` : '/admin/api/serialref';

        const loadingState = setupTableLoading(tbody, 4, 'loadSerialStart', 'row');

        fetch(url)
            .then(r => r.json())
            .then(data => {
                finishTableLoading(loadingState);
                const entries = data.entries || [];
                if (entries.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="empty-state" style="padding:1.5rem; text-align:center;">No serial start entries found.</td></tr>`;
                    return;
                }
                tbody.innerHTML = '';
                _ssSelectedId = null;
                _ssSelectedData = null;
                entries.forEach((e, idx) => {
                    const tr = document.createElement('tr');
                    tr.style.cssText = `cursor:pointer;`;

                    tr.onclick = () => {
                        const wasSelected = tr.classList.contains('selected');
                        tbody.querySelectorAll('tr').forEach(t => t.classList.remove('selected'));

                        if (wasSelected) {
                            _ssSelectedId = null;
                            _ssSelectedData = null;
                        } else {
                            tr.classList.add('selected');
                            _ssSelectedId = e.id;
                            _ssSelectedData = e;
                        }
                    };

                    tr.innerHTML = `
                        <td style="padding:10px 12px; vertical-align:middle; font-weight:500; color:var(--text-secondary);">${idx + 1}</td>
                        <td style="padding:10px 12px; vertical-align:middle;"><strong>${e.modelcode || '—'}</strong></td>
                        <td style="padding:10px 12px; vertical-align:middle;"><span style="
                            display:inline-block; padding:2px 10px; border-radius:12px; font-size:11px; font-weight:600;
                            background:var(--accent-primary,#3b82f6)22; color:var(--accent-primary,#3b82f6);
                            border:1px solid var(--accent-primary,#3b82f6)44;
                        ">${e.area || '—'}</span></td>
                        <td style="padding:10px 12px; vertical-align:middle;"><code style="font-size:13px; font-weight:700; letter-spacing:1px;">${e.serialstart || '—'}</code></td>
                    `;
                    tbody.appendChild(tr);
                });
            })
            .catch(() => {
                finishTableLoading(loadingState);
                tbody.innerHTML = `<tr><td colspan="4" class="empty-state" style="padding:1.5rem;">Failed to load serial start data.</td></tr>`;
            });
    };

    window.saveSerialStart = function () {
        const modelcode = document.getElementById('ss-modelcode').value.trim().toUpperCase();
        const area = document.getElementById('ss-area').value.trim();
        const serialstart = document.getElementById('ss-serialstart').value.trim();

        if (!modelcode || !area || !serialstart) {
            showToast('Model Code, Area, and Serial Start are all required.', 'error');
            return;

        const isEdit = _ssEditId !== null;
        const url = isEdit ? `/admin/api/serialref/${_ssEditId}` : '/admin/api/serialref';
        const method = isEdit ? 'PUT' : 'POST';

        fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },

            .then(r => r.json())
            .then(data => {

                    closeSerialStartModal();
                    loadSerialStart();
                } else {
                    showToast(data.error || 'Failed to save.', 'error');

    //  Gas Charge Tolerance Reference
    // â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
    let _gtSelectedId = null;
    let _gtSelectedData = null;
    let _gtEditId = null;
    let _gtCurrentTargetCharge = 0;

    window.loadGasTolRefs = function () {
        const tbody = document.getElementById('gt-tbody');
        if (!tbody) return;

        const loadingState = setupTableLoading(tbody, 6, 'loadGasTolRefs', 'row');

        fetch('/admin/api/modelref')
            .then(r => r.json())
            .then(data => {
                finishTableLoading(loadingState);
                const entries = data.entries || [];
                if (entries.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="empty-state" style="padding:1.5rem; text-align:center;">No gas charge tolerances found.</td></tr>`;
                    return;
                }
                tbody.innerHTML = '';
                _gtSelectedId = null;
                _gtSelectedData = null;
                entries.forEach((e, idx) => {
                    const tr = document.createElement('tr');
                    tr.style.cssText = `cursor:pointer;`;
                    tr.onclick = () => {
                        const wasSelected = tr.classList.contains('selected');
                        tbody.querySelectorAll('tr').forEach(t => t.classList.remove('selected'));

                        if (wasSelected) {
                            _gtSelectedId = null;
                            _gtSelectedData = null;
                        } else {
                            tr.classList.add('selected');
                            _gtSelectedId = e.id;
                            _gtSelectedData = e;
                        }
                    };

                    const target = e.gascharge_base ? parseFloat(e.gascharge_base).toFixed(2) : '0.00';
                    const pos = e.gmstolpos || 0;
                    const neg = e.gmstolneg || 0;
                    const upper = (parseFloat(target) + pos).toFixed(2);
                    const lower = Math.max(0, parseFloat(target) - neg).toFixed(2);

                    tr.innerHTML = `
                        <td style="padding:10px 12px; vertical-align:middle; font-weight:500; color:var(--text-secondary);">${idx + 1}</td>
                        <td style="padding:10px 12px; vertical-align:middle;"><strong>${e.modelcode || '—'}</strong></td>
                        <td style="padding:10px 12px; vertical-align:middle;">${target} kg</td>
                        <td style="padding:10px 12px; vertical-align:middle; color:var(--success-color);">+ ${pos} kg</td>
                        <td style="padding:10px 12px; vertical-align:middle; color:var(--danger-color);">- ${neg} kg</td>
                        <td style="padding:10px 12px; vertical-align:middle;"><code style="font-size:13px; font-weight:700;">${lower} kg - ${upper} kg</code></td>
                    `;
                    tbody.appendChild(tr);
                });
            })
            .catch(() => {
                finishTableLoading(loadingState);
                tbody.innerHTML = `<tr><td colspan="6" class="empty-state" style="padding:1.5rem;">Failed to load gas charge tolerances.</td></tr>`;
            });
    };

    window.gtModelChanged = function () {
        const modelcode = document.getElementById('gt-modelcode').value.trim();
        if (!modelcode) {
            _gtCurrentTargetCharge = 0;
            updateGtRangePreview();
            return;
        }
        fetch('/admin/api/model-gas-target/' + encodeURIComponent(modelcode))
            .then(r => r.json())
            .then(data => {
                _gtCurrentTargetCharge = parseFloat(data.target_charge) || 0;
                updateGtRangePreview();
            })
            .catch(() => {
                _gtCurrentTargetCharge = 0;
                updateGtRangePreview();
            });

    window.updateGtRangePreview = function () {
        const previewEl = document.getElementById('gt-preview-text');
        if (!_gtCurrentTargetCharge) {
            previewEl.textContent = 'Select a model...';
            previewEl.style.color = 'var(--text-muted, #94a3b8)';
            return;
        }
        const pos = parseFloat(document.getElementById('gt-gmstolpos').value) || 0;
        const neg = parseFloat(document.getElementById('gt-gmstolneg').value) || 0;
        const upper = (_gtCurrentTargetCharge + pos).toFixed(2);
        const lower = Math.max(0, _gtCurrentTargetCharge - neg).toFixed(2);

        previewEl.innerHTML = `Target: <strong>${_gtCurrentTargetCharge.toFixed(2)} kg</strong> <br><span style="color:var(--text-color);">Range:</span> <span style="color:var(--success-color);">${lower} kg - ${upper} kg</span>`;

    //  PRINT SPECIFIC QC REPORT
    // â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
    window.openQCReportModal = function () {
        document.getElementById('qc-specific-serial').value = '';
        document.getElementById('qc-specific-error').style.display = 'none';

        const select = document.getElementById('qc-specific-model');
        if (select.tomselect) {
            select.tomselect.clearOptions();
            select.tomselect.addOption({ value: "", text: "Loading models..." });
            select.tomselect.refreshOptions(false);
        } else {
            select.innerHTML = '<option value="">Loading models...</option>';
        }

        document.getElementById('modal-specific-qc').classList.add('active');

        // Fetch models to populate dropdown
        fetch('/admin/api/models')
            .then(r => r.json())
            .then(models => {
                if (select.tomselect) {
                    select.tomselect.clearOptions();
                    select.tomselect.addOption({ value: "", text: "-- Select Model --" });
                    models.forEach(m => {
                        const val = m.model_number || m;
                        select.tomselect.addOption({ value: val, text: val });
                    });

    window.resolveWip = function () {
        if (!currentWipData) return;

        const saveBtn = document.getElementById('wip-save-btn');
        if (saveBtn) saveBtn.disabled = true;

        const action = document.querySelector('input[name="wip_active_action"]:checked')?.value || 'continue';
        const crsNewPlanInput = document.getElementById('wip-crs-new-plan');
        const crsNewPlan = crsNewPlanInput.value;

        if (action === 'continue' && document.getElementById('wip-crs-plan-edit').style.display !== 'none') {
            const minValid = parseInt(crsNewPlanInput.min) || 0;
            if (parseInt(crsNewPlan) < minValid) {
                showToast(`Total plan for ${document.getElementById('wip-crs-model').innerText} cannot be less than units already produced (${minValid}).`, "error");
                if (saveBtn) saveBtn.disabled = false;
                return;
            }
        }

        const unstartedPlans = {};
        document.querySelectorAll('.wip-unstarted-checkbox:checked').forEach(cb => {
            const planInput = document.querySelector(`.wip-unstarted-plan[data-id="${cb.value}"]`);
            unstartedPlans[cb.value] = planInput ? planInput.value : null;
        });

        const payload = {
            line_id: currentWipLine,
            action: action,
            crs_new_plan: crsNewPlan,
            unstarted_plans: unstartedPlans
        };

        const doFetch = () => {
            fetch('/admin/api/wip-resolve', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
                .then(r => r.json())
                .then(res => {
                    if (saveBtn) saveBtn.disabled = false;
                    if (res.success) {
                        closeWipModal();
                        showToast("WIP resolved successfully", 'success');
                        const dateDisplay = document.getElementById('sched-date-display');
                        if (dateDisplay) fetchSchedules(dateDisplay.innerText);
                    } else {
                        showToast(res.error || "Error resolving WIP", 'error');
                    }
                })
                .catch(err => {
                    if (saveBtn) saveBtn.disabled = false;
                    showToast("Error resolving WIP", 'error');
                });
        };

        if (action === 'clear') {
            showConfirmModal("Are you sure you want to discard this unfinished schedule and clear it from the conveyor belt? This cannot be undone.", () => {
                doFetch();
            });
            if (saveBtn) saveBtn.disabled = false;
        } else {
            doFetch();
        }
    };

    let currentShiftId = null;

    function fetchShifts() {
        const tbody = document.getElementById('shifts-tbody');
        tbody.innerHTML = '<tr><td colspan="4" class="empty-state">Loading...</td></tr>';

        fetch('/admin/api/shifts')
            .then(r => r.json())
            .then(data => {
                tbody.innerHTML = '';
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="empty-state">No shifts found</td></tr>';
                    return;
                }
                data.forEach((shift, index) => {
                    const tr = document.createElement('tr');
                    tr.onclick = () => selectShiftRow(tr, shift);
                    tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${shift.name}</td>
                    <td>${shift.start_time}</td>
                    <td>${shift.end_time}</td>
                `;
                    tbody.appendChild(tr);
                });
            })
            .catch(err => {
                console.error('Error fetching shifts:', err);
                tbody.innerHTML = '<tr><td colspan="5" class="empty-state" style="color:var(--danger)">Failed to load shifts</td></tr>';
            });
    }

    function selectShiftRow(tr, shift) {
        const wasSelected = tr.classList.contains('selected');
        const tbody = document.getElementById('shifts-tbody');
        Array.from(tbody.getElementsByTagName('tr')).forEach(row => row.classList.remove('selected'));

        if (wasSelected) {
            currentShiftId = null;
            document.getElementById('shift-edit-btn').disabled = true;
            document.getElementById('shift-id').value = '';
            document.getElementById('shift-name-preview').value = '';
            document.getElementById('shift-start').value = '';
            document.getElementById('shift-end').value = '';
        } else {
            tr.classList.add('selected');
            currentShiftId = shift.id;
            document.getElementById('shift-edit-btn').disabled = false;
            document.getElementById('shift-id').value = shift.id;
            document.getElementById('shift-name-preview').value = shift.name;
            document.getElementById('shift-start').value = shift.start_time;
            document.getElementById('shift-end').value = shift.end_time;
        }
    }

    function openShiftModal() {
        const modal = document.getElementById('modal-shift');
        const title = document.getElementById('shift-modal-title');
        title.innerText = 'Edit Shift';

        modal.classList.add('active');
    }

    function closeShiftModal() {
        document.getElementById('modal-shift').classList.remove('active');
    }

    function saveShift() {
        const id = document.getElementById('shift-id').value;
        const start_time = document.getElementById('shift-start').value;
        const end_time = document.getElementById('shift-end').value;

        if (!start_time || !end_time || !id) {
            showToast('Please fill out all required fields.', 'error');
            return;
        }

        const url = `/admin/api/shifts/${id}`;
        const method = 'PUT';

        fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ start_time, end_time })
        })
            .then(r => r.json())
            .then(res => {
                if (res.success) {
                    closeShiftModal();
                    fetchShifts();
                    showToast('Shift saved successfully!', 'success');
                    document.getElementById('shift-edit-btn').disabled = true;
                    currentShiftId = null;
                } else {
                    showToast('Error: ' + res.error, 'error');
                }
            })
            .catch(err => {
                console.error(err);
                showToast('Server error while saving shift.', 'error');
            });
    }

    window.loadTransferSlips = function (page = 1) {
        const date = document.getElementById('ts-filter-date').value;
        const line = document.getElementById('ts-filter-line').value;
        const ref = document.getElementById('ts-search-ref').value.trim();
        const tbody = document.getElementById('ts-tbody');
        
        if (tableSelection.ts) selectRow('ts', document.createElement('tr'), null);
        const printBtn = document.getElementById('ts-btn-print');
        const exportCsvBtn = document.getElementById('ts-btn-export-csv');
        if (printBtn) printBtn.disabled = true;
        if (exportCsvBtn) exportCsvBtn.disabled = true;

        let url = `/admin/api/transfer-slips?page=${page}`;
        if (date) url += `&date=${encodeURIComponent(date)}`;
        if (line && line !== 'all') url += `&line=${encodeURIComponent(line)}`;
        if (ref) url += `&ref=${encodeURIComponent(ref)}`;

        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:20px; color:#94a3b8;">Loading...</td></tr>`;

        fetch(url).then(r => r.json()).then(data => {
            if (!data.success || !data.records.length) {
                tbody.innerHTML = buildEmptyState(7, 'No Transfer Slips', 'No slips found matching your filters.');
                return;
            }
            tbody.innerHTML = '';
            data.records.forEach(r => {
                const tr = document.createElement('tr');
                tr.className = 'bom-row';
                tr.style.cursor = 'pointer';
                tr.onclick = function (e) {
                    if (e.target.closest('button')) return;
                    selectRow('ts', tr, r);
                };
                
                tr.innerHTML = `
                    <td style="font-family: monospace; font-weight: 600; color: var(--primary);">${r.ref_number}</td>
                    <td>${r.production_date}</td>
                    <td><span class="status-badge" style="background:#f1f5f9; color:#475569;">${r.line}</span></td>
                    <td>${r.shift}</td>
                    <td>${r.modelcode}</td>
                    <td style="font-weight: 600;">${r.total_qty}</td>
                    <td>${r.created_by || 'System'}</td>
                `;
                tbody.appendChild(tr);
            });
        }).catch(err => {
            console.error(err);
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:20px; color:red;">Failed to load.</td></tr>`;
        });
    };

    let tsDatePicker = null;

    window.openCreateTransferSlipModal = function () {
        document.getElementById('modal-create-ts').classList.add('active');
        const dateInput = document.getElementById('create-ts-date');
        
        // Fetch available dates to highlight in Flatpickr
        fetch('/admin/api/transfer-slips/available-dates')
            .then(r => r.json())
            .then(data => {
                let availableDates = [];
                if (data.success && data.dates) {
                    availableDates = data.dates;
                }
                
                // Default to the most recent available date, or today if empty
                const defaultDate = availableDates.length > 0 ? availableDates[0] : new Date().toISOString().split('T')[0];
                dateInput.value = defaultDate;

                if (tsDatePicker) {
                    tsDatePicker.destroy();
                }

                tsDatePicker = flatpickr(dateInput, {
                    defaultDate: defaultDate,
                    onDayCreate: function(dObj, dStr, fp, dayElem) {
                        // Format the date object to YYYY-MM-DD
                        const formatted = fp.formatDate(dayElem.dateObj, "Y-m-d");
                        if (availableDates.includes(formatted)) {
                            dayElem.classList.add("has-data-highlight");
                        }
                    },
                    onChange: function(selectedDates, dateStr, instance) {
                        dateInput.value = dateStr;
                        dateInput.dispatchEvent(new Event('change'));
                    }
                });

                // Trigger change to load initial models/lines
                dateInput.dispatchEvent(new Event('change'));
            })
            .catch(err => {
                console.error("Failed to fetch available dates", err);
                const defaultDate = new Date().toISOString().split('T')[0];
                dateInput.value = defaultDate;
                if (!tsDatePicker) {
                    tsDatePicker = flatpickr(dateInput, { defaultDate: defaultDate });
                }
                dateInput.dispatchEvent(new Event('change'));
            });
    };

    window.submitCreateTransferSlip = function () {

        const btn = document.querySelector('#modal-create-ts .btn-primary');

        btn.innerHTML = 'Generating...';

        fetch('/admin/api/transfer-slips', {

            body: JSON.stringify({ date, line, shift, modelcode })
        }).then(r => r.json()).then(data => {
            btn.innerHTML = oldText;

            if (data.success) {
                showToast(`Transfer Slip ${data.ref_number} generated!`, 'success');
                closeModal('modal-create-ts');
                loadTransferSlips(1);

        }).catch(err => {
            btn.innerHTML = oldText;
            btn.disabled = false;
            showToast('Network error', 'error');
        });

                item.style.cssText = 'padding: 10px 15px; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: background 0.2s;';
                item.onmouseover = () => item.style.background = '#f8fafc';
                item.onmouseout = () => item.style.background = 'white';

                item.innerHTML = `
                    <input type="checkbox" class="qc-unit-checkbox" value="${r.serial}" style="width: 15px; height: 15px; cursor: pointer;">
                    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
                        <div style="display: flex; justify-content: space-between;">
                            <strong style="font-family: monospace; font-size: 14px;">${r.serial}</strong>
                            <span style="font-size: 12px; color: #64748b;">${r.time}</span>
                        </div>
                        <div style="display: flex; gap: 10px; font-size: 12px; color: #64748b;">
                            <span>Model: <strong>${r.modelcode}</strong></span>
                            <span>Line: <strong>${r.line}</strong></span>
                        </div>
                    </div>
                `;

                // Allow clicking anywhere on the row to toggle checkbox
                item.addEventListener('click', (e) => {
                    if (e.target.tagName !== 'INPUT') {
                        const cb = item.querySelector('input');
                        cb.checked = !cb.checked;
                        updateQCSelectedCount();
                    }
                });

                item.querySelector('input').addEventListener('change', updateQCSelectedCount);
                listEl.appendChild(item);
            });
        }).catch(err => {
            listEl.innerHTML = `<div style="padding: 20px; text-align: center; color: red; font-size: 14px;">Failed to load.</div>`;
        });
    };

    // â”€â”€â”€ SCOREBOARD NATIVE UI LOGIC â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    let scoreboardRefreshTimer = null;
    let isScoreboardRefreshing = false;

    window.switchScoreboardTab = function (tab) {
        document.getElementById('tab-sb-status').classList.remove('active');
        document.getElementById('tab-sb-sched').classList.remove('active');
        document.getElementById('tab-sb-logs').classList.remove('active');

        document.getElementById('sb-content-sched').style.display = 'none';

    function initScoreboardDate() {
        // Disabled: User requested the date to default to empty (all dates) 
        // and allow manual clearing without being overridden by today's date.
    }

    function isScoreboardToday() {
        const dateInput = document.getElementById('scoreboard-date-selector');
        if (!dateInput || !dateInput.value) return false;
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        const todayStr = `${yyyy}-${mm}-${dd}`;
        return dateInput.value === todayStr;
    }

    window.fetchScoreboard = function (isAutoRefresh = false) {
        if (!document.getElementById('panel-scoreboard').classList.contains('active')) return;

        // Prevent overlapping refreshes
        if (isAutoRefresh && isScoreboardRefreshing) return;
        isScoreboardRefreshing = true;

        initScoreboardDate();

        const dateStr = document.getElementById('scoreboard-date-selector').value;
        const lineStr = document.getElementById('scoreboard-line-selector').value || (globalActiveLines.length > 0 ? globalActiveLines[0].lineno : 'L1');
        const modelStr = document.getElementById('scoreboard-model-selector').value || 'all';
        const sortStr = document.getElementById('scoreboard-sort-selector').value || 'desc';

        // 1. Fetch dynamic models for this line/date (only if not an auto-refresh)
        if (!isAutoRefresh) {
            fetch(`/api/scoreboard/models?line=${encodeURIComponent(lineStr)}&date=${encodeURIComponent(dateStr)}`)
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        const sel = document.getElementById('scoreboard-model-selector');
                        const currentVal = sel.value;
                        sel.innerHTML = '<option value="all">All Models</option>';
                        data.models.forEach(m => {
                            const opt = document.createElement('option');
                            opt.value = m;
                            opt.textContent = m;
                            sel.appendChild(opt);
                        });
                        // Preserve selected if still valid
                        if (data.models.includes(currentVal)) {
                            sel.value = currentVal;
                        }
                    }
                });
        }

        // 2. Fetch Logs
        const logsTbody = document.getElementById('scoreboard-logs-tbody');
        if (!isAutoRefresh) {
            logsTbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Loading...</td></tr>';
        }

        fetch(`/api/scoreboard/logs?line=${encodeURIComponent(lineStr)}&date=${encodeURIComponent(dateStr)}&model=${encodeURIComponent(modelStr)}&sort=${encodeURIComponent(sortStr)}&limit=50`)
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    if (data.logs.length === 0) {
                        logsTbody.innerHTML = '<tr><td colspan="5" class="empty-state">No logs found for these filters.</td></tr>';
                    } else {
                        logsTbody.innerHTML = '';
                        data.logs.forEach((log, index) => {
                            const tr = document.createElement('tr');
                            let statusBadge = '';
                            if (log.status === 'GOOD' || log.status === 'PASS' || log.status === 'OK') {
                                statusBadge = '<span class="badge" style="background:#22c55e; color:white; border:none; padding:4px 8px; border-radius:4px; font-size:12px; font-weight:700;">GOOD</span>';
                            } else {
                                statusBadge = '<span class="badge" style="background:#ef4444; color:white; border:none; padding:4px 8px; border-radius:4px; font-size:12px; font-weight:700;">NO GOOD</span>';
                            }
                            tr.innerHTML = `
                                <td style="font-weight:600; color:var(--text-muted);">${index + 1}</td>
                                <td style="font-weight:600;">${log.time || '--:--:--'}</td>
                                <td>${log.model}</td>
                                <td style="font-family: monospace; font-weight:600;">${log.serial}</td>
                                <td>${statusBadge}</td>
                            `;
                            logsTbody.appendChild(tr);
                        });
                    }
                }
            })
            .catch(err => console.error(err));

        // 3. Fetch WIP & Schedule Data
        fetch(`/api/scoreboard/data?line=${encodeURIComponent(lineStr)}&date=${encodeURIComponent(dateStr)}`)
            .then(r => r.json())
            .then(data => {
                isScoreboardRefreshing = false;
                if (data.success) {
                    // Update Schedule Grid
                    const schedTbody = document.getElementById('scoreboard-sched-tbody');

                    // On-Going Production Logic
                    const ogContainer = document.getElementById('sb-ongoing-container');
                    ogContainer.style.display = 'flex';

                    if (lineStr === 'all') {
                        document.getElementById('sb-og-model').innerHTML = '—';
                        document.getElementById('sb-og-rsched').innerText = '0';
                        document.getElementById('sb-og-ract').innerText = '0';
                        document.getElementById('sb-og-var').innerText = '0';

                        let circle = document.getElementById('sb-og-circle');
                        circle.style.backgroundColor = 'transparent';
                        circle.style.borderColor = 'var(--border)';
                        circle.style.color = 'var(--text-main)';
                        document.getElementById('sb-og-status').innerText = 'N/A';
                        document.getElementById('sb-og-icon').innerHTML = '—';
                    } else {
                        const shiftStart = new Date(`${data.date}T${data.shift_start}`);
                        const now = new Date();
                        let diffSeconds = Math.floor((now - shiftStart) / 1000);
                        if (diffSeconds < 0) diffSeconds = 0;

                        let remainingSeconds = diffSeconds;
                        let activeModel = null;
                        let activeRSched = 0;
                        let activeRAct = 0;
                        let activeVar = 0;

                        data.data.forEach(sched => {
                            let rSched = 0;
                            let requiredSeconds = sched.plan * (sched.takt_time || 1);

                            if (remainingSeconds >= requiredSeconds) {
                                rSched = sched.plan;
                                remainingSeconds -= requiredSeconds;
                            } else {
                                rSched = Math.floor(remainingSeconds / (sched.takt_time || 1));
                                remainingSeconds = 0;
                            }

                            if (rSched > sched.plan) rSched = sched.plan;
                            let variance = sched.actual - rSched;

                            if (sched.status === 'ON-GOING') {
                                activeModel = sched.modelcode;
                                activeRSched = rSched;
                                activeRAct = sched.actual;
                                activeVar = variance;
                            }
                        });

                        if (activeModel) {
                            document.getElementById('sb-og-model').innerText = activeModel;
                            document.getElementById('sb-og-rsched').innerText = activeRSched;
                            document.getElementById('sb-og-ract').innerText = activeRAct;
                            document.getElementById('sb-og-var').innerText = activeVar;

                            let circle = document.getElementById('sb-og-circle');
                            let stext = document.getElementById('sb-og-status');
                            let sicon = document.getElementById('sb-og-icon');

                            if (activeRAct === 0) {
                                circle.style.backgroundColor = 'transparent';
                                circle.style.borderColor = 'var(--border)';
                                circle.style.color = 'var(--text-main)';
                                stext.innerText = 'Standby';
                                sicon.innerHTML = '—';
                            } else if (activeVar < -20) {
                                circle.style.backgroundColor = '#ef4444'; // Red
                                circle.style.borderColor = '#ef4444';
                                circle.style.color = 'white';
                                stext.innerText = 'Behind';
                                sicon.innerText = '!';
                            } else if (activeVar < 0) {
                                circle.style.backgroundColor = '#facc15'; // Yellow
                                circle.style.borderColor = '#facc15';
                                circle.style.color = 'black';
                                stext.innerText = 'Behind';
                                sicon.innerText = '!';
                            } else if (activeVar === 0) {
                                circle.style.backgroundColor = '#84cc16'; // Yellow-Green
                                circle.style.borderColor = '#84cc16';
                                circle.style.color = 'white';
                                stext.innerText = 'On-Time';
                                sicon.innerText = 'âœ“';
                            } else {
                                circle.style.backgroundColor = '#22c55e'; // Green
                                circle.style.borderColor = '#22c55e';
                                circle.style.color = 'white';
                                stext.innerText = 'Ahead';
                                sicon.innerText = 'âœ“';
                            }
                        } else {
                            document.getElementById('sb-og-model').innerHTML = '—';
                            document.getElementById('sb-og-rsched').innerText = '0';
                            document.getElementById('sb-og-ract').innerText = '0';
                            document.getElementById('sb-og-var').innerText = '0';

                            let circle = document.getElementById('sb-og-circle');
                            circle.style.backgroundColor = 'transparent';
                            circle.style.borderColor = 'var(--border)';
                            circle.style.color = 'var(--text-main)';
                            document.getElementById('sb-og-status').innerText = 'N/A';
                            document.getElementById('sb-og-icon').innerHTML = '—';
                        }
                    }

                    if (data.data.length === 0) {
                        schedTbody.innerHTML = '<tr><td colspan="4" class="empty-state">No scheduled runs for this date.</td></tr>';
                    } else {
                        schedTbody.innerHTML = '';
                        data.data.forEach(sched => {
                            const tr = document.createElement('tr');
                            let badge = '';
                            if (sched.status === 'DONE') badge = '<span style="color:#22c55e;font-weight:700;">Done</span>';
                            else if (sched.status === 'ON-GOING') badge = '<span style="color:#3b82f6;font-weight:700;">Running</span>';
                            else badge = '<span style="color:#94a3b8;font-weight:700;">Waiting</span>';

                            tr.innerHTML = `
                                <td>${sched.modelcode}</td>
                                <td>${sched.plan}</td>
                                <td>${sched.actual}</td>
                                <td>${badge}</td>
                            `;
                            schedTbody.appendChild(tr);
                        });
                    }

                    // Update WIP Grid
                    if (data.wip) {
                        if (document.getElementById('sb-wip-crs')) document.getElementById('sb-wip-crs').textContent = data.wip.crs || 0;
                        document.getElementById('sb-wip-att').textContent = data.wip.att || 0;
                        document.getElementById('sb-wip-gms').textContent = data.wip.gms || 0;
                        document.getElementById('sb-wip-spamsi').textContent = data.wip.spamsi || 0;
                        document.getElementById('sb-wip-spamso').textContent = data.wip.spamso || 0;
                        document.getElementById('sb-wip-wc').textContent = data.wip.wc || 0;
                        document.getElementById('sb-wip-ri').textContent = data.wip.ri || 0;
                        document.getElementById('sb-wip-fi').textContent = data.wip.fi || 0;
                        document.getElementById('sb-wip-pit').textContent = data.wip.pit || 0;

                        if (data.wip.models) {
                            if (document.getElementById('sb-wip-crs-model')) document.getElementById('sb-wip-crs-model').textContent = data.wip.models.crs || '—';
                            document.getElementById('sb-wip-att-model').textContent = data.wip.models.att || '—';
                            document.getElementById('sb-wip-gms-model').textContent = data.wip.models.gms || '—';
                            document.getElementById('sb-wip-spamsi-model').textContent = data.wip.models.spamsi || '—';
                            document.getElementById('sb-wip-spamso-model').textContent = data.wip.models.spamso || '—';
                            document.getElementById('sb-wip-wc-model').textContent = data.wip.models.wc || '—';
                            document.getElementById('sb-wip-ri-model').textContent = data.wip.models.ri || '—';
                            document.getElementById('sb-wip-fi-model').textContent = data.wip.models.fi || '—';
                            document.getElementById('sb-wip-pit-model').textContent = data.wip.models.pit || '—';
                        }
                    }
                }
            })
            .catch(err => {
                isScoreboardRefreshing = false;
                console.error(err);
            });

        manageScoreboardTimer();
    };

    window.loadScoreboardData = function () {
        // Hard refresh (not auto refresh)
        fetchScoreboard(false);
    };

    function manageScoreboardTimer() {
        if (scoreboardRefreshTimer) {
            clearInterval(scoreboardRefreshTimer);
            scoreboardRefreshTimer = null;
        }

        // Only auto-refresh if it's today's date and the panel is active
        if (isScoreboardToday() && document.getElementById('panel-scoreboard').classList.contains('active')) {
            scoreboardRefreshTimer = setInterval(() => {
                fetchScoreboard(true);
            }, 10000);
        }
    }

    // Auto-load scoreboard on initial page load if it's the active panel
    document.addEventListener('DOMContentLoaded', () => {
        // Remove old iframe event listeners if any
        const dateInput = document.getElementById('scoreboard-date-selector');
        const lineInput = document.getElementById('scoreboard-line-selector');

        if (dateInput) {
            dateInput.addEventListener('change', () => loadScoreboardData());
        }
        if (lineInput) {
            lineInput.addEventListener('change', () => loadScoreboardData());
        }
    });
